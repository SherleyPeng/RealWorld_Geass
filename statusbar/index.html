<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>真实世界·状态栏</title>
<style>
:root {
  --bg: #0d0f14;
  --panel: #141820;
  --card: #1a1f2a;
  --card2: #222833;
  --border: #2a3344;
  --text: #e8ecf4;
  --muted: #8b95a8;
  --dim: #5c677a;
  --accent: #c9a227;
  --accent2: #e8c547;
  --pink: #e879a9;
  --blue: #5b9fd4;
  --green: #5ecf8e;
  --orange: #e8a55a;
  --red: #e86a6a;
  --radius: 10px;
  --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: transparent;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
#app {
  background: linear-gradient(165deg, #12151c 0%, #0d0f14 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,.45);
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 12px;
  background: linear-gradient(90deg, #1a1520 0%, #141820 50%, #121820 100%);
  border-bottom: 1px solid var(--border);
}
.topbar .brand {
  font-size: 11px;
  letter-spacing: .12em;
  color: var(--accent);
  font-weight: 600;
  text-transform: uppercase;
}
.topbar .chips {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end;
}
.chip {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.chip strong { color: var(--accent2); font-weight: 600; }

.tabs {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 0;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 auto;
  min-width: 52px;
  padding: 9px 10px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  border: none;
  background: transparent;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s, background .15s;
  position: relative;
}
.tab:hover { color: var(--text); background: rgba(255,255,255,.03); }
.tab.active {
  color: var(--accent2);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.tab .badge {
  position: absolute;
  top: 4px; right: 4px;
  min-width: 14px; height: 14px;
  padding: 0 4px;
  border-radius: 999px;
  background: var(--accent);
  color: #111;
  font-size: 9px;
  font-weight: 700;
  line-height: 14px;
}

.panel {
  display: none;
  padding: 12px;
  max-height: 420px;
  overflow-y: auto;
  background: var(--bg);
}
.panel.active { display: block; }
.panel::-webkit-scrollbar { width: 5px; }
.panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.section-title {
  font-size: 11px;
  color: var(--dim);
  letter-spacing: .08em;
  margin: 10px 0 6px;
  text-transform: uppercase;
}
.section-title:first-child { margin-top: 0; }

.kv {
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 4px 10px;
  margin-bottom: 6px;
}
.kv .k { color: var(--dim); font-size: 12px; }
.kv .v { color: var(--text); word-break: break-word; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 8px;
}
.card h3 {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent2);
  margin-bottom: 6px;
}
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.accent { color: var(--accent2); }
.pink { color: var(--pink); }
.green { color: var(--green); }
.blue { color: var(--blue); }
.orange { color: var(--orange); }
.red { color: var(--red); }
.mono { font-variant-numeric: tabular-nums; }

.fold {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  margin-bottom: 8px;
  overflow: hidden;
}
.fold > summary {
  list-style: none;
  cursor: pointer;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  user-select: none;
  background: var(--card2);
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after {
  content: "▸";
  color: var(--dim);
  font-size: 11px;
  transition: transform .15s;
}
.fold[open] > summary::after { transform: rotate(90deg); }
.fold > summary .title {
  font-weight: 600;
  color: var(--text);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.fold > summary .meta { color: var(--muted); font-size: 11px; }
.fold-body { padding: 10px 12px 12px; border-top: 1px solid var(--border); }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin-top: 8px;
}
.stat-cell {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 8px;
  text-align: center;
}
.stat-cell .n {
  font-size: 15px;
  font-weight: 700;
  color: var(--accent2);
  font-variant-numeric: tabular-nums;
}
.stat-cell .l { font-size: 10px; color: var(--dim); margin-top: 2px; }

.tag {
  display: inline-block;
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(201,162,39,.15);
  color: var(--accent2);
  border: 1px solid rgba(201,162,39,.35);
}
.tag.pink {
  background: rgba(232,121,169,.12);
  color: var(--pink);
  border-color: rgba(232,121,169,.3);
}
.tag.blue {
  background: rgba(91,159,212,.12);
  color: var(--blue);
  border-color: rgba(91,159,212,.3);
}
.tag.green {
  background: rgba(94,207,142,.12);
  color: var(--green);
  border-color: rgba(94,207,142,.3);
}

.msg {
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 12px;
}
.msg:last-child { border-bottom: none; }
.msg .when { color: var(--dim); font-size: 10px; margin-bottom: 2px; }
.msg.out .body { color: var(--blue); }
.msg.in .body { color: var(--text); }

.empty {
  text-align: center;
  padding: 28px 12px;
  color: var(--dim);
  font-size: 12px;
}
.empty .ico { font-size: 22px; margin-bottom: 6px; opacity: .5; }

.money { color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums; }
.row-list { list-style: none; }
.row-list li {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.row-list li:last-child { border-bottom: none; }

.demo-banner {
  font-size: 10px;
  text-align: center;
  padding: 3px;
  background: rgba(232,106,106,.15);
  color: var(--red);
  border-bottom: 1px solid var(--border);
}
</style>
</head>
<body>
<div id="app">
  <div id="demoBanner" class="demo-banner" style="display:none">演示数据 · 等待 MVU 变量</div>
  <div class="topbar">
    <div class="brand">REAL WORLD</div>
    <div class="chips">
      <span class="chip" id="chipDate">—</span>
      <span class="chip" id="chipCash">现金 <strong id="chipCashVal">—</strong></span>
      <span class="chip" id="chipLoc">—</span>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="role">角色</button>
    <button class="tab" data-tab="map">地图</button>
    <button class="tab" data-tab="harem">后宫<span class="badge" id="badgeHarem" style="display:none">0</span></button>
    <button class="tab" data-tab="acquaint">熟人<span class="badge" id="badgeAcq" style="display:none">0</span></button>
    <button class="tab" data-tab="assets">资产</button>
    <button class="tab" data-tab="wx">微信<span class="badge" id="badgeWx" style="display:none">0</span></button>
    <button class="tab" data-tab="geass">言灵<span class="badge" id="badgeGeass" style="display:none">0</span></button>
  </div>
  <div class="panel active" id="panel-role"></div>
  <div class="panel" id="panel-map"></div>
  <div class="panel" id="panel-harem"></div>
  <div class="panel" id="panel-acquaint"></div>
  <div class="panel" id="panel-assets"></div>
  <div class="panel" id="panel-wx"></div>
  <div class="panel" id="panel-geass"></div>
</div>

<script>
(function () {
  'use strict';

  var state = null;
  var isDemo = false;

  function $(id) { return document.getElementById(id); }

  function g(obj, path, def) {
    if (obj == null) return def;
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return def;
      cur = cur[parts[i]];
    }
    if (cur === undefined || cur === null || cur === '') return def;
    // MagVU [value, desc] pair
    if (Array.isArray(cur) && cur.length >= 1 && (typeof cur[0] !== 'object' || cur[0] === null)) {
      return cur[0] === undefined || cur[0] === null ? def : cur[0];
    }
    return cur;
  }

  function unwrap(data) {
    if (!data) return null;
    var sd = data.stat_data || data;
    // double nest
    if (sd && sd.stat_data && (sd.stat_data.user || sd.stat_data.time)) {
      sd = sd.stat_data;
    }
    if (data.display_data) {
      var dd = data.display_data;
      if (dd.stat_data && (dd.stat_data.user || dd.stat_data.time)) dd = dd.stat_data;
      // prefer live stat_data for structure
    }
    return sd;
  }

  function calcAge(birth, nowDate) {
    if (!birth || !nowDate) return '—';
    try {
      var b = birth.split('-').map(Number);
      var n = nowDate.split('-').map(Number);
      var age = n[0] - b[0];
      if (n[1] < b[1] || (n[1] === b[1] && n[2] < b[2])) age--;
      return age >= 0 ? age : '—';
    } catch (e) { return '—'; }
  }

  function money(n) {
    if (typeof n !== 'number' || isNaN(n)) return '—';
    return n.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + ' 元';
  }

  function entries(obj) {
    if (!obj || typeof obj !== 'object') return [];
    return Object.keys(obj).filter(function (k) {
      return k !== '$meta' && obj[k] != null;
    }).map(function (k) {
      return { key: k, val: obj[k] };
    });
  }

  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function withUserSexCount(sx) {
    if (!sx) return 0;
    var c = g(sx, 'with_user.total', null);
    if (typeof c === 'number') return c;
    c = g(sx, 'with_user_count', null);
    if (typeof c === 'number') return c;
    // fallback sum
    var w = g(sx, 'with_user', {});
    if (w && typeof w === 'object') {
      var sum = 0;
      ['vaginal', 'oral', 'anal', 'breast', 'service', 'creampie', 'total'].forEach(function (k) {
        if (k !== 'total' && typeof w[k] === 'number') sum += w[k];
      });
      if (typeof w.total === 'number') return w.total;
      return sum;
    }
    return 0;
  }

  function isHarem(npcKey, sd) {
    var sx = g(sd, 'sexual.' + npcKey, null) || g(sd, 'sexual', {})[npcKey];
    if (!sx) return false;
    return withUserSexCount(sx) >= 1;
  }

  /* ---------- tabs ---------- */
  document.getElementById('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    var id = btn.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t === btn); });
    document.querySelectorAll('.panel').forEach(function (p) {
      p.classList.toggle('active', p.id === 'panel-' + id);
    });
    postHeight();
  });

  /* ---------- renderers ---------- */
  function renderTop(sd) {
    var date = g(sd, 'time.current_date', '—');
    var time = g(sd, 'time.current_time', '');
    $('chipDate').textContent = time ? (date + ' ' + time) : date;
    $('chipCashVal').textContent = money(g(sd, 'assets.cash', 0));
    var loc = g(sd, 'situation.place', '') || g(sd, 'situation.current', '—');
    if (loc.length > 18) loc = loc.slice(0, 18) + '…';
    $('chipLoc').textContent = loc;
  }

  function renderRole(sd) {
    var u = g(sd, 'user', {});
    var birth = g(u, 'birth_date', '');
    var age = calcAge(birth, g(sd, 'time.current_date', ''));
    var identity = g(u, 'identity', '') || g(u, 'background.current_status', '—');
    var classLabel = g(u, 'social_class', '') || '';
    var repParts = [];
    entries(g(sd, 'reputation', {})).forEach(function (e) {
      var label = g(e.val, 'label', e.key);
      var val = g(e.val, 'value', '');
      repParts.push(label + (val !== '' ? '(' + val + ')' : ''));
    });
    var loc = g(sd, 'situation.place', '') || g(sd, 'situation.current', '—');
    var bank = g(sd, 'assets.bank', 0);
    var cash = g(sd, 'assets.cash', 0);
    var wealthHint = '';
    var total = (typeof bank === 'number' ? bank : 0) + (typeof cash === 'number' ? cash : 0);
    if (total >= 1e8) wealthHint = '超级富豪';
    else if (total >= 1e7) wealthHint = '富豪';
    else if (total >= 1e6) wealthHint = '高净值';
    else if (total >= 1e5) wealthHint = '小康偏上';
    else if (total >= 1e4) wealthHint = '普通工薪';
    else wealthHint = '经济紧张';

    var html = '';
    html += '<div class="card">';
    html += '<h3>' + esc(g(u, 'name', '{{user}}')) + ' <span class="tag">' + esc(g(u, 'gender', '')) + '</span></h3>';
    html += '<div class="kv"><div class="k">年龄</div><div class="v">' + esc(age) + (birth ? ' <span class="dim">(' + esc(birth) + ')</span>' : '') + '</div></div>';
    html += '<div class="kv"><div class="k">身高</div><div class="v">' + esc(g(u, 'height', '—')) + ' cm</div></div>';
    html += '<div class="kv"><div class="k">外貌</div><div class="v">' + esc(g(u, 'appearance', '—')) + '</div></div>';
    html += '<div class="kv"><div class="k">着装</div><div class="v">' + esc(g(u, 'clothing_style', '—')) + '</div></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<h3>当前身份</h3>';
    html += '<div class="kv"><div class="k">状态</div><div class="v">' + esc(identity) + '</div></div>';
    if (classLabel) html += '<div class="kv"><div class="k">阶级</div><div class="v">' + esc(classLabel) + '</div></div>';
    html += '<div class="kv"><div class="k">财力</div><div class="v"><span class="tag green">' + esc(wealthHint) + '</span></div></div>';
    html += '<div class="kv"><div class="k">声望</div><div class="v">' + esc(repParts.length ? repParts.join(' · ') : '尚无记录') + '</div></div>';
    html += '<div class="kv"><div class="k">背景</div><div class="v muted">' + esc(g(u, 'background.education', '')) + '</div></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<h3>所在地</h3>';
    html += '<div class="kv"><div class="k">位置</div><div class="v">' + esc(loc) + '</div></div>';
    html += '<div class="kv"><div class="k">住所</div><div class="v muted">' + esc(g(u, 'background.residence', '—')) + '</div></div>';
    html += '</div>';

    $('panel-role').innerHTML = html;
  }

  function renderMap(sd) {
    var date = g(sd, 'time.current_date', '—');
    var time = g(sd, 'time.current_time', '—');
    var weather = g(sd, 'time.weather', '—');
    var place = g(sd, 'situation.place', '—');
    var region = g(sd, 'situation.region', '');
    var env = g(sd, 'situation.environment', '') || g(sd, 'situation.current', '—');
    var day = g(sd, 'time.day_count', 0);

    var html = '<div class="card">';
    html += '<h3>时间</h3>';
    html += '<div class="kv"><div class="k">日期</div><div class="v mono">' + esc(date) + '</div></div>';
    html += '<div class="kv"><div class="k">时刻</div><div class="v mono accent">' + esc(time) + '</div></div>';
    html += '<div class="kv"><div class="k">穿越第</div><div class="v">' + esc(day) + ' 天</div></div>';
    html += '<div class="kv"><div class="k">天气</div><div class="v">' + esc(weather) + '</div></div>';
    html += '</div>';

    html += '<div class="card">';
    html += '<h3>位置</h3>';
    if (region) html += '<div class="kv"><div class="k">区域</div><div class="v">' + esc(region) + '</div></div>';
    html += '<div class="kv"><div class="k">精确</div><div class="v accent">' + esc(place) + '</div></div>';
    html += '<div class="kv"><div class="k">环境</div><div class="v muted">' + esc(env) + '</div></div>';
    html += '</div>';

    var locs = entries(g(sd, 'world.location_library', {}));
    if (locs.length) {
      html += '<div class="section-title">已知地点</div>';
      locs.forEach(function (e) {
        html += '<div class="card"><strong>' + esc(g(e.val, 'name', e.key)) + '</strong>';
        html += '<div class="muted" style="margin-top:4px">' + esc(g(e.val, 'description', '')) + '</div></div>';
      });
    }

    $('panel-map').innerHTML = html;
  }

  function sexStatsBlock(sx) {
    var wu = g(sx, 'with_user', {}) || {};
    var totalLife = g(sx, 'body_count_times', null);
    if (totalLife == null) totalLife = g(sx, 'total_sex_count', 0);
    var withUser = typeof wu.total === 'number' ? wu.total : withUserSexCount(sx);

    var html = '<div class="section-title">性爱统计</div>';
    html += '<div class="stat-grid">';
    html += '<div class="stat-cell"><div class="n">' + esc(totalLife) + '</div><div class="l">生涯总次数</div></div>';
    html += '<div class="stat-cell"><div class="n pink">' + esc(withUser) + '</div><div class="l">与主角</div></div>';
    html += '<div class="stat-cell"><div class="n">' + esc(wu.vaginal || 0) + '</div><div class="l">性交</div></div>';
    html += '<div class="stat-cell"><div class="n">' + esc(wu.oral || 0) + '</div><div class="l">口交</div></div>';
    html += '<div class="stat-cell"><div class="n">' + esc(wu.breast || 0) + '</div><div class="l">乳交</div></div>';
    html += '<div class="stat-cell"><div class="n">' + esc(wu.anal || 0) + '</div><div class="l">肛交</div></div>';
    html += '<div class="stat-cell"><div class="n">' + esc(wu.service || 0) + '</div><div class="l">侍奉</div></div>';
    html += '<div class="stat-cell"><div class="n">' + esc(wu.creampie || 0) + '</div><div class="l">内射</div></div>';
    html += '</div>';
    return html;
  }

  function renderHarem(sd) {
    var sexual = g(sd, 'sexual', {});
    var rels = g(sd, 'npc_relations', {});
    var list = [];
    entries(sexual).forEach(function (e) {
      if (withUserSexCount(e.val) >= 1) list.push(e);
    });
    // also include npc_relations marked as intimate even if sexual sparse
    entries(rels).forEach(function (e) {
      var rel = String(g(e.val, 'relationship', ''));
      if (/恋人|女友|后宫|情人|包养|奴隶|宠物|禁脔|炮友|妻子|未婚妻/.test(rel)) {
        if (!list.some(function (x) { return x.key === e.key; }) && withUserSexCount(g(sexual, e.key, {})) >= 1) {
          list.push({ key: e.key, val: g(sexual, e.key, {}) });
        }
      }
    });

    $('badgeHarem').style.display = list.length ? 'inline-block' : 'none';
    $('badgeHarem').textContent = list.length;

    if (!list.length) {
      $('panel-harem').innerHTML = '<div class="empty"><div class="ico">♡</div>暂无后宫成员<br><span class="dim">与主角发生性关系后将出现在此</span></div>';
      return;
    }

    var html = '';
    list.forEach(function (e) {
      var sx = e.val || {};
      var npc = g(rels, e.key, {}) || {};
      var name = g(sx, 'name', '') || g(npc, 'name', e.key);
      var age = g(sx, 'age', '') || g(npc, 'age', '');
      var birth = g(sx, 'birth_date', '') || g(npc, 'birth_date', '');
      if (!age && birth) age = calcAge(birth, g(sd, 'time.current_date', ''));
      var job = g(sx, 'occupation', '') || g(npc, 'occupation', '') || g(npc, 'job', '—');
      var rel = g(npc, 'relationship', g(sx, 'relationship', '—'));
      var clothing = g(sx, 'clothing', null);
      var clothStr = '';
      if (clothing && typeof clothing === 'object') {
        clothStr = [g(clothing, 'top', ''), g(clothing, 'bottom', ''), g(clothing, 'underwear.bra', ''), g(clothing, 'underwear.panties', '')].filter(Boolean).join(' / ');
      } else {
        clothStr = g(sx, 'clothing_desc', '—');
      }

      var virgin = g(sx, 'virgin', null);
      var firstPartner = g(sx, 'first_partner', '');
      var firstReason = g(sx, 'first_sex_reason', '') || g(sx, 'lost_virginity_to', '');
      var virginHtml = '';
      if (virgin === true) {
        virginHtml = '<span class="tag green">处女</span>';
      } else if (virgin === false) {
        virginHtml = '<span class="tag pink">非处</span>';
        if (firstPartner) virginHtml += ' <span class="muted">初夜：' + esc(firstPartner) + '</span>';
        if (firstReason) virginHtml += '<div class="dim" style="margin-top:4px">失贞缘由：' + esc(firstReason) + '</div>';
      }

      var body = g(sx, 'body_specs', null) || g(sx, 'body_features', null) || g(sx, 'body', null) || {};
      var breast = g(body, 'breast', g(sx, 'breast', ''));
      if (breast && typeof breast === 'object') breast = [g(breast, 'cup', ''), g(breast, 'shape', ''), g(breast, 'nipple', '')].filter(Boolean).join(' / ');
      var genitals = g(body, 'genitals', g(sx, 'genitals', ''));
      if (genitals && typeof genitals === 'object') genitals = [g(genitals, 'type', ''), g(genitals, 'color', ''), g(genitals, 'hair', '')].filter(Boolean).join(' / ');
      var waist = g(body, 'waist_hip', g(sx, 'waist', ''));
      if (waist && typeof waist === 'object') waist = [g(waist, 'waist', ''), g(waist, 'hips', '')].filter(Boolean).join(' / ');
      var face = g(body, 'face', g(sx, 'face', ''));
      if (face && typeof face === 'object') face = [g(face, 'features', ''), g(face, 'makeup', '')].filter(Boolean).join(' / ');

      html += '<details class="fold">';
      html += '<summary><span class="title">' + esc(name);
      if (age !== '' && age !== '—') html += ' <span class="meta">' + esc(age) + '岁</span>';
      html += ' <span class="tag pink">' + esc(rel) + '</span></span></summary>';
      html += '<div class="fold-body">';
      html += '<div class="kv"><div class="k">职业</div><div class="v">' + esc(job) + '</div></div>';
      if (birth) html += '<div class="kv"><div class="k">生日</div><div class="v">' + esc(birth) + '</div></div>';
      html += '<div class="kv"><div class="k">关系</div><div class="v">' + esc(rel) + '</div></div>';
      html += '<div class="kv"><div class="k">穿着</div><div class="v muted">' + esc(clothStr || '—') + '</div></div>';
      html += '<div class="kv"><div class="k">贞操</div><div class="v">' + virginHtml + '</div></div>';
      if (face) html += '<div class="kv"><div class="k">面容</div><div class="v">' + esc(face) + '</div></div>';
      if (breast) html += '<div class="kv"><div class="k">胸部</div><div class="v">' + esc(breast) + '</div></div>';
      if (waist) html += '<div class="kv"><div class="k">腰臀</div><div class="v">' + esc(waist) + '</div></div>';
      if (genitals) html += '<div class="kv"><div class="k">私处</div><div class="v">' + esc(typeof genitals === 'string' ? genitals : JSON.stringify(genitals)) + '</div></div>';
      var mood = g(npc, 'context.current_mood', '');
      if (mood) html += '<div class="kv"><div class="k">情绪</div><div class="v">' + esc(mood) + '</div></div>';
      html += sexStatsBlock(sx);
      html += '</div></details>';
    });
    $('panel-harem').innerHTML = html;
  }

  function renderAcquaint(sd) {
    var rels = g(sd, 'npc_relations', {});
    var sexual = g(sd, 'sexual', {});
    var list = [];
    entries(rels).forEach(function (e) {
      // exclude harem (sex with user >= 1) unless male
      var sx = g(sexual, e.key, null);
      var gender = g(e.val, 'gender', '') || g(sx, 'gender', '');
      var isFemaleHarem = sx && withUserSexCount(sx) >= 1 && gender !== '男';
      if (isFemaleHarem) return;
      list.push(e);
    });

    $('badgeAcq').style.display = list.length ? 'inline-block' : 'none';
    $('badgeAcq').textContent = list.length;

    if (!list.length) {
      $('panel-acquaint').innerHTML = '<div class="empty"><div class="ico">◎</div>暂无熟人记录</div>';
      return;
    }

    var html = '';
    list.forEach(function (e) {
      var n = e.val;
      var name = g(n, 'name', e.key);
      var age = g(n, 'age', '—');
      var job = g(n, 'occupation', g(n, 'job', '—'));
      var rel = g(n, 'relationship', '—');
      var imp = g(n, 'impression', null);
      html += '<div class="card">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center">';
      html += '<strong>' + esc(name) + '</strong>';
      html += '<span class="tag blue">' + esc(rel) + '</span></div>';
      html += '<div class="kv" style="margin-top:6px"><div class="k">年龄</div><div class="v">' + esc(age) + '</div></div>';
      html += '<div class="kv"><div class="k">职业</div><div class="v">' + esc(job) + '</div></div>';
      if (imp != null) html += '<div class="kv"><div class="k">印象</div><div class="v">' + esc(imp) + '</div></div>';
      var mood = g(n, 'context.current_mood', '');
      if (mood) html += '<div class="kv"><div class="k">情绪</div><div class="v muted">' + esc(mood) + '</div></div>';
      html += '</div>';
    });
    $('panel-acquaint').innerHTML = html;
  }

  function renderAssets(sd) {
    var a = g(sd, 'assets', {});
    var cash = g(a, 'cash', 0);
    var bank = g(a, 'bank', 0);
    var banks = g(a, 'banks', null); // multi-bank preferred

    var html = '<div class="card"><h3>流动资金</h3>';
    html += '<div class="kv"><div class="k">现金</div><div class="v money">' + money(cash) + '</div></div>';
    if (banks && typeof banks === 'object' && Object.keys(banks).length) {
      entries(banks).forEach(function (e) {
        var nm = g(e.val, 'name', e.key);
        var bal = g(e.val, 'balance', e.val);
        if (typeof bal === 'object') bal = g(e.val, 'balance', 0);
        html += '<div class="kv"><div class="k">' + esc(nm) + '</div><div class="v money">' + money(typeof bal === 'number' ? bal : Number(bal) || 0) + '</div></div>';
      });
    } else {
      html += '<div class="kv"><div class="k">银行存款</div><div class="v money">' + money(bank) + '</div></div>';
      html += '<div class="dim" style="font-size:11px">（可拆为多家银行写入 assets.banks）</div>';
    }
    html += '</div>';

    function listBlock(title, obj, fields) {
      var list = entries(obj || {});
      html += '<div class="section-title">' + title + ' · ' + list.length + '</div>';
      if (!list.length) {
        html += '<div class="card dim">暂无</div>';
        return;
      }
      list.forEach(function (e) {
        html += '<div class="card"><strong>' + esc(g(e.val, 'name', e.key)) + '</strong>';
        fields.forEach(function (f) {
          var v = g(e.val, f.key, '');
          if (v === '' || v == null) return;
          if (f.money && typeof v === 'number') v = money(v);
          html += '<div class="kv"><div class="k">' + f.label + '</div><div class="v">' + esc(v) + '</div></div>';
        });
        html += '</div>';
      });
    }

    listBlock('房产', g(a, 'estates', {}), [
      { key: 'address', label: '地址' },
      { key: 'area', label: '面积' },
      { key: 'value', label: '估值', money: true }
    ]);
    listBlock('车产', g(a, 'vehicles', {}), [
      { key: 'plate', label: '车牌' },
      { key: 'color', label: '颜色' }
    ]);
    listBlock('产业', g(a, 'companies', {}), [
      { key: 'shares', label: '持股' },
      { key: 'role', label: '身份' },
      { key: 'value', label: '估值', money: true }
    ]);

    $('panel-assets').innerHTML = html;
  }

  function renderWx(sd) {
    var wx = g(sd, 'wechat', {});
    var list = entries(wx);
    $('badgeWx').style.display = list.length ? 'inline-block' : 'none';
    $('badgeWx').textContent = list.length;

    if (!list.length) {
      $('panel-wx').innerHTML = '<div class="empty"><div class="ico">💬</div>暂无微信记录<br><span class="dim">与 NPC 产生信息往来后显示</span></div>';
      return;
    }

    var html = '';
    list.forEach(function (e) {
      var contact = e.val || {};
      var name = g(contact, 'name', e.key);
      var msgs = g(contact, 'messages', []);
      if (!Array.isArray(msgs)) {
        // object map
        msgs = entries(msgs).map(function (m) { return m.val; });
      }
      msgs = msgs.slice().sort(function (a, b) {
        return String(g(a, 'time', '')).localeCompare(String(g(b, 'time', '')));
      });
      html += '<details class="fold">';
      html += '<summary><span class="title">' + esc(name) + ' <span class="meta">' + msgs.length + ' 条</span></span></summary>';
      html += '<div class="fold-body">';
      if (!msgs.length) html += '<div class="dim">无消息</div>';
      msgs.forEach(function (m) {
        var dir = g(m, 'dir', g(m, 'from', '')) === 'user' || g(m, 'dir', '') === 'out' ? 'out' : 'in';
        html += '<div class="msg ' + dir + '">';
        html += '<div class="when">' + esc(g(m, 'time', '')) + (dir === 'out' ? ' · 我' : ' · 对方') + '</div>';
        html += '<div class="body">' + esc(g(m, 'text', g(m, 'content', ''))) + '</div>';
        html += '</div>';
      });
      html += '</div></details>';
    });
    $('panel-wx').innerHTML = html;
  }

  function renderGeass(sd) {
    var geass = g(sd, 'geass', {});
    var list = entries(geass);
    $('badgeGeass').style.display = list.length ? 'inline-block' : 'none';
    $('badgeGeass').textContent = list.length;

    if (!list.length) {
      $('panel-geass').innerHTML = '<div class="empty"><div class="ico">✦</div>尚未使用言灵</div>';
      return;
    }

    var html = '<div class="card"><strong>已使用言灵</strong> · <span class="accent">' + list.length + '</span> 种</div>';
    list.forEach(function (e) {
      var gss = e.val || {};
      html += '<details class="fold">';
      html += '<summary><span class="title">' + esc(g(gss, 'name', e.key));
      html += ' <span class="tag">' + esc(g(gss, 'type', '')) + '</span>';
      html += ' <span class="meta">×' + esc(g(gss, 'total_uses', 1)) + '</span></span></summary>';
      html += '<div class="fold-body">';
      html += '<div class="muted" style="margin-bottom:8px">' + esc(g(gss, 'description', '')) + '</div>';
      var hist = g(gss, 'use_history', {});
      var uses = entries(hist).sort(function (a, b) {
        return String(g(a.val, 'date', '')).localeCompare(String(g(b.val, 'date', '')));
      });
      if (!uses.length) html += '<div class="dim">无使用记录</div>';
      uses.forEach(function (u) {
        html += '<div class="msg">';
        html += '<div class="when">' + esc(g(u.val, 'date', '')) + (g(u.val, 'time', '') ? ' ' + esc(g(u.val, 'time', '')) : '') + '</div>';
        html += '<div class="body">对 <span class="accent">' + esc(g(u.val, 'target', '')) + '</span>：' + esc(g(u.val, 'effect_desc', '')) + '</div>';
        html += '</div>';
      });
      html += '</div></details>';
    });
    $('panel-geass').innerHTML = html;
  }

  function renderAll(sd) {
    if (!sd) return;
    state = sd;
    renderTop(sd);
    renderRole(sd);
    renderMap(sd);
    renderHarem(sd);
    renderAcquaint(sd);
    renderAssets(sd);
    renderWx(sd);
    renderGeass(sd);
    postHeight();
  }

  function postHeight() {
    try {
      var h = document.getElementById('app').scrollHeight;
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'realworld-statusbar-resize', height: h }, '*');
      }
    } catch (e) {}
  }

  /* ---------- data source ---------- */
  function tryMvu() {
    try {
      if (typeof parent !== 'undefined' && parent.Mvu && parent.Mvu.getMvuData) {
        var d = parent.Mvu.getMvuData({ type: 'message', message_id: 'latest' })
          || parent.Mvu.getMvuData({ type: 'chat' });
        var sd = unwrap(d);
        if (sd && (sd.user || sd.time || sd.assets)) {
          isDemo = false;
          $('demoBanner').style.display = 'none';
          renderAll(sd);
          return true;
        }
      }
    } catch (e) {}
    try {
      if (typeof parent !== 'undefined' && parent.getVariables) {
        var v = parent.getVariables({ type: 'chat' }) || parent.getVariables();
        var sd2 = unwrap(v);
        if (sd2 && (sd2.user || sd2.time)) {
          isDemo = false;
          $('demoBanner').style.display = 'none';
          renderAll(sd2);
          return true;
        }
      }
    } catch (e2) {}
    return false;
  }

  function demoData() {
    return {
      user: {
        name: '彭少镭', gender: '男', birth_date: '1994-12-21', height: 172,
        appearance: '皮肤白皙，相貌俊秀，身材匀称', clothing_style: '休闲',
        identity: '求职中的建模学员', social_class: '普通青年',
        background: {
          education: '北京火星时代 3D 建模',
          current_status: '求职中',
          residence: '合租单间'
        }
      },
      time: { current_date: '2013-12-14', current_time: '13:05', day_count: 0, weather: '阴冷 · 灰霾' },
      situation: {
        region: '北京 · 海淀',
        place: '合租单间 · 下铺',
        current: '折叠桌前看空邮箱',
        environment: '暖气半热，窗缝漏风，邮箱空空'
      },
      assets: { cash: 200, bank: 1200, banks: {}, companies: {}, estates: {}, vehicles: {} },
      geass: {}, npc_relations: {}, sexual: {}, reputation: {}, wechat: {},
      world: { known_regions: {}, location_library: {} },
      _meta: { uid_counters: {} }
    };
  }

  function boot() {
    if (!tryMvu()) {
      isDemo = true;
      $('demoBanner').style.display = 'block';
      renderAll(demoData());
    }
    setInterval(function () { tryMvu(); }, 2000);
    window.addEventListener('message', function (ev) {
      if (!ev.data) return;
      if (ev.data.type === 'realworld-mvu-update' || ev.data.stat_data) {
        var sd = unwrap(ev.data.stat_data ? ev.data : ev.data);
        if (sd) {
          isDemo = false;
          $('demoBanner').style.display = 'none';
          renderAll(sd);
        }
      }
    });
    setTimeout(postHeight, 100);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
