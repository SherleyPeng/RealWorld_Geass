<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>真实世界 · 状态栏</title>
<style>
:root {
  --bg: #0c0e12;
  --surface: #141820;
  --surface2: #1a2030;
  --surface3: #222a3a;
  --line: rgba(212, 175, 100, 0.14);
  --line2: rgba(212, 175, 100, 0.28);
  --gold: #d4af64;
  --gold2: #e8c97a;
  --gold-dim: rgba(212, 175, 100, 0.12);
  --text: #ebe6dc;
  --muted: #8b857a;
  --dim: #5c574f;
  --ok: #6dbf7a;
  --ok-bg: rgba(109, 191, 122, 0.12);
  --bad: #c97a7a;
  --bad-bg: rgba(201, 122, 122, 0.12);
  --warn: #d4a84b;
  --warn-bg: rgba(212, 168, 75, 0.12);
  --pink: #d4a0b8;
  --blue: #7aa3c4;
  --r: 10px;
  --font: 13px/1.55 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  background: var(--bg);
  color: var(--text);
  font: var(--font);
  min-width: 260px;
  -webkit-font-smoothing: antialiased;
}
button, summary { font: inherit; color: inherit; }

.sb { display: flex; flex-direction: column; min-height: 100%; }

.demo {
  display: none;
  text-align: center;
  font-size: 10.5px;
  letter-spacing: .06em;
  color: var(--warn);
  background: var(--warn-bg);
  padding: 4px 8px;
  border-bottom: 1px solid rgba(212, 168, 75, .2);
}

.hero {
  position: relative;
  padding: 14px 14px 12px;
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(212,175,100,.1), transparent 55%),
    linear-gradient(180deg, #151922 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--line);
  overflow: hidden;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg width='40' height='40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 20h40M20 0v40' stroke='%23d4af64' stroke-opacity='.03'/%3E%3C/svg%3E");
  pointer-events: none;
}
.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  position: relative;
}
.hero-date {
  font-size: 16px;
  font-weight: 600;
  color: var(--gold2);
  letter-spacing: .02em;
  line-height: 1.25;
}
.hero-sub {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 3px;
}
.hero-sub span { color: var(--gold); }
.money {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
  flex-shrink: 0;
}
.money-pill {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--gold-dim);
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.money-pill .k { font-size: 10px; color: var(--muted); }
.money-pill .v { font-size: 12.5px; font-weight: 600; color: var(--gold2); }
.hero-sit {
  margin-top: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  background: rgba(0,0,0,.25);
  border: 1px solid var(--line);
  font-size: 12px;
  color: var(--muted);
  line-height: 1.45;
  position: relative;
}
.hero-sit strong { color: var(--text); font-weight: 500; }

.tabs {
  display: flex;
  gap: 2px;
  padding: 6px 8px 0;
  overflow-x: auto;
  scrollbar-width: none;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative;
  flex-shrink: 0;
  padding: 8px 12px;
  border: none;
  background: transparent;
  color: var(--dim);
  font-size: 12px;
  cursor: pointer;
  border-radius: 8px 8px 0 0;
  transition: color .15s, background .15s;
  white-space: nowrap;
}
.tab:hover { color: var(--gold2); background: rgba(212,175,100,.05); }
.tab.active {
  color: var(--gold);
  background: rgba(212,175,100,.08);
  font-weight: 500;
}
.tab.active::after {
  content: "";
  position: absolute;
  left: 10px; right: 10px; bottom: -1px;
  height: 2px;
  background: var(--gold);
  border-radius: 2px 2px 0 0;
}
.tab .count {
  display: inline-block;
  min-width: 16px;
  margin-left: 4px;
  padding: 0 5px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 600;
  background: var(--gold-dim);
  color: var(--gold);
  line-height: 16px;
  text-align: center;
}

.panels { padding: 10px 10px 14px; }
.panel { display: none; flex-direction: column; gap: 6px; animation: fade .18s ease; }
.panel.active { display: flex; }
@keyframes fade { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

.sec {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0 2px;
  font-size: 10px;
  letter-spacing: .12em;
  color: var(--dim);
  text-transform: uppercase;
}
.sec::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  padding: 8px 12px;
  font-size: 12.5px;
}
.row + .row { border-top: 1px solid var(--line); }
.row .l { color: var(--muted); flex-shrink: 0; min-width: 3.5em; }
.row .r {
  text-align: right;
  color: var(--text);
  word-break: break-word;
  line-height: 1.4;
  max-width: 72%;
}
.row .r.em { color: var(--gold2); font-weight: 500; }

.opp {
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--gold);
  border-radius: var(--r);
}
.opp-t { font-size: 13px; font-weight: 500; color: var(--gold2); }
.opp-d { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.opp-s { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.opp-s span {
  font-size: 10.5px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--gold-dim);
  color: var(--gold);
  border: 1px solid var(--line);
}

.task {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.task .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--gold);
  flex-shrink: 0;
  box-shadow: 0 0 0 3px var(--gold-dim);
}
.task .dot.done { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
.task .dot.fail { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
.task .body { flex: 1; min-width: 0; }
.task .name {
  font-size: 12.5px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.task .meta { font-size: 10.5px; color: var(--dim); margin-top: 1px; }
.badge {
  flex-shrink: 0;
  font-size: 10.5px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--gold-dim);
  color: var(--gold);
  border: 1px solid var(--line);
}
.badge.done { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.badge.fail { background: var(--bad-bg); color: var(--bad); border-color: transparent; }

.items { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.item {
  padding: 8px 10px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
}
.item .n { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .q { font-size: 11px; color: var(--gold); font-weight: 600; flex-shrink: 0; }

.person {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  overflow: hidden;
}
.person summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  cursor: pointer;
  user-select: none;
  transition: background .15s;
}
.person summary::-webkit-details-marker { display: none; }
.person summary:hover { background: rgba(212,175,100,.04); }
.person[open] summary {
  border-bottom: 1px solid var(--line);
  background: rgba(212,175,100,.03);
}
.av {
  width: 34px; height: 34px;
  border-radius: 8px;
  background: var(--surface3);
  border: 1px solid var(--line);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}
.person .info { flex: 1; min-width: 0; }
.person .nm {
  font-size: 13px;
  font-weight: 500;
  display: flex; align-items: center; gap: 6px;
}
.person .nm .tag {
  font-size: 10px;
  font-weight: 400;
  color: var(--pink);
  padding: 1px 6px;
  border-radius: 4px;
  background: rgba(212,160,184,.12);
}
.person .rel { font-size: 11px; color: var(--muted); margin-top: 1px; }
.imp {
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
  min-width: 28px;
  text-align: right;
}
.person .detail { padding: 8px 12px 12px; }
.kv {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 3px 0;
  font-size: 11.5px;
}
.kv .k { color: var(--dim); flex-shrink: 0; }
.kv .v { text-align: right; color: var(--text); word-break: break-word; }
.bar {
  height: 3px;
  border-radius: 2px;
  background: var(--surface3);
  margin-top: 8px;
  overflow: hidden;
}
.bar > i {
  display: block;
  height: 100%;
  border-radius: 2px;
  transition: width .3s;
}

.wallet { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.wallet .box {
  padding: 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  text-align: center;
}
.wallet .box .lbl { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; }
.wallet .box .val {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold2);
  font-variant-numeric: tabular-nums;
}
.asset-row {
  display: flex;
  justify-content: space-between;
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  font-size: 12.5px;
}
.asset-row .l { color: var(--gold); font-weight: 500; }
.asset-sub {
  display: flex;
  justify-content: space-between;
  padding: 2px 12px 2px 16px;
  font-size: 11px;
  color: var(--muted);
}

.contact {
  display: flex;
  gap: 10px;
  padding: 10px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  align-items: flex-start;
}
.contact .body { flex: 1; min-width: 0; }
.contact .nm {
  font-size: 12.5px;
  font-weight: 500;
  display: flex; gap: 6px; align-items: baseline;
}
.contact .nm .role { font-size: 10.5px; font-weight: 400; color: var(--muted); }
.contact .preview {
  font-size: 12px;
  color: var(--muted);
  margin-top: 3px;
  line-height: 1.4;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.contact .when { font-size: 10px; color: var(--dim); margin-top: 3px; }

.geass {
  padding: 11px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--gold);
  border-radius: var(--r);
}
.geass-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.geass-name { font-size: 13px; font-weight: 600; color: var(--gold2); }
.geass-type {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--gold-dim);
  color: var(--gold);
  border: 1px solid var(--line);
}
.geass-d { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.45; }
.geass-m { font-size: 10.5px; color: var(--dim); margin-top: 5px; }

.loc {
  padding: 9px 12px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.loc-n { font-size: 12.5px; font-weight: 500; }
.loc-d { font-size: 11.5px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--gold-dim);
  color: var(--gold);
  border: 1px solid var(--line);
}

.empty {
  text-align: center;
  padding: 28px 16px;
  color: var(--dim);
  font-size: 12.5px;
  line-height: 1.7;
}
.empty .h { font-size: 11px; color: var(--dim); opacity: .75; margin-top: 4px; }
.empty .ico { font-size: 22px; margin-bottom: 8px; opacity: .45; }
</style>
</head>

<script>
(function () {
  'use strict';

  function g(obj, path, def) {
    if (obj == null) return def;
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null || typeof cur !== 'object') return def;
      cur = cur[parts[i]];
    }
    return (cur === '' || cur == null) ? def : cur;
  }

  function S(val, maxDepth) {
    if (maxDepth === undefined) maxDepth = 3;
    if (val === null || val === undefined) return '—';
    if (typeof val === 'string') return val || '—';
    if (typeof val === 'number' || typeof val === 'boolean') return val === true ? '是' : val === false ? '否' : val;
    if (Array.isArray(val)) {
      if (!val.length) return '—';
      if (maxDepth <= 0) return '…';
      return val.map(function (v) { return S(v, maxDepth - 1); }).join('、');
    }
    if (typeof val === 'object') {
      try {
        var s = JSON.stringify(val);
        return s.length > 48 ? s.slice(0, 48) + '…' : s;
      } catch (e) { return '…'; }
    }
    return String(val);
  }

  function money(n) {
    if (n === null || n === undefined || n === '') return '—';
    var num = Number(n);
    if (isNaN(num)) return String(n);
    var abs = Math.abs(num);
    if (abs >= 1e8) return (num / 1e8).toFixed(2).replace(/\.?0+$/, '') + '亿';
    if (abs >= 1e4) return (num / 1e4).toFixed(abs % 1e4 === 0 ? 0 : 1) + '万';
    return num.toLocaleString('zh-CN');
  }

  function impColor(v) {
    if (v >= 51) return '#6dbf7a';
    if (v >= 21) return '#8ab86a';
    if (v >= -20) return '#d4af64';
    if (v >= -50) return '#c99a6a';
    return '#c97a7a';
  }

  function impPct(v) {
    return Math.max(0, Math.min(100, (Number(v) + 100) / 2));
  }

  function age(birth, current) {
    if (!birth || !current) return null;
    var b = birth.split('-').map(Number);
    var c = current.split('-').map(Number);
    if (b.length !== 3 || c.length !== 3) return null;
    var a = c[0] - b[0];
    if (c[1] < b[1] || (c[1] === b[1] && c[2] < b[2])) a--;
    return a;
  }

  function weekday(ds) {
    if (!ds || !/^\d{4}-\d{2}-\d{2}$/.test(ds)) return '';
    var d = new Date(ds.replace(/-/g, '/') + ' 12:00:00');
    if (isNaN(d.getTime())) return '';
    return '周' + '日一二三四五六'[d.getDay()];
  }

  function emoji(imp) {
    if (imp >= 50) return '😊';
    if (imp >= 1) return '🙂';
    if (imp >= -20) return '😐';
    return '😕';
  }

  function resize() {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'sb-resize', height: document.body.scrollHeight }, '*');
      }
    } catch (e) {}
  }

  function setCount(id, n) {
    var el = document.getElementById(id);
    if (!el) return;
    if (n > 0) {
      el.style.display = 'inline-block';
      el.textContent = n > 99 ? '99+' : String(n);
    } else {
      el.style.display = 'none';
    }
  }

      }]

      location_library: {
        loc_001: { name: '合租单间', description: '上下铺，暖气不足，月租均摊约 400' },
        loc_002: { name: '火星时代机房', description: '毕业前常待，现已不多去' }
      }
    },
    geass: {},
    _meta: { schema_version: '1.1.0' }
  };

  function renderHeader(d) {
    var date = g(d, 'time.current_date', '—');
    var day = g(d, 'time.day_count', '—');
    var wd = weekday(date);
    document.getElementById('hdrDate').textContent = date + (wd ? '  ·  ' + wd : '');
    document.getElementById('hdrSub').innerHTML = '穿越第 <span>' + day + '</span> 天';
    document.getElementById('hdrCash').textContent = '¥' + money(g(d, 'assets.cash'));
    document.getElementById('hdrBank').textContent = '¥' + money(g(d, 'assets.bank'));

    var sit = g(d, 'situation.current', '');
    var box = document.getElementById('hdrSit');
    if (sit) {
      box.style.display = 'block';
      document.getElementById('hdrSitText').textContent = sit;
    } else {
      box.style.display = 'none';
    }
  }

  function row(l, r, em) {
    return '<div class="row"><span class="l">' + l + '</span><span class="r' + (em ? ' em' : '') + '">' + r + '</span></div>';
  }

  function empty(title, hint) {
    return '<div class="empty"><div class="ico">◇</div>' + title + '<div class="h">' + (hint || '') + '</div></div>';
  }

  function kv(k, v) {
    return '<div class="kv"><span class="k">' + k + '</span><span class="v">' + v + '</span></div>';
  }

  function renderState(d) {
    var html = '';
    var user = g(d, 'user', {});
    var time = g(d, 'time', {});
    var sit = g(d, 'situation', {});
    var tasks = g(d, 'tasks', {}) || {};
    var items = g(d, 'items', {}) || {};

    var birth = g(user, 'birth_date', '');
    var a = age(birth, g(time, 'current_date', ''));

    html += '<div class="sec">人物</div><div class="card">';
    html += row('姓名', S(g(user, 'name', '未设置')), true);
    if (g(user, 'gender')) html += row('性别', g(user, 'gender'));
    html += row('年龄', a !== null ? a + ' 岁' : S(birth));
    if (g(user, 'height')) html += row('身高', g(user, 'height') + ' cm');
    if (g(user, 'appearance')) html += row('外貌', S(g(user, 'appearance')));
    if (g(user, 'clothing_style')) html += row('穿着', S(g(user, 'clothing_style')));
    var phone = g(user, 'devices.phone', '');
    var laptop = g(user, 'devices.laptop', '');
    if (phone || laptop) {
      html += row('设备', [phone, laptop].filter(Boolean).join('<br>'));
    }
    if (g(user, 'background.residence')) html += row('住所', S(g(user, 'background.residence')));
    html += '</div>';

    var opps = g(sit, 'opportunities', []);
    if (Array.isArray(opps) && opps.length) {
      html += '<div class="sec">机遇</div>';
      opps.forEach(function (op) {
        html += '<div class="opp">';
        html += '<div class="opp-t">' + S(g(op, 'name')) + '</div>';
        if (g(op, 'description')) html += '<div class="opp-d">' + S(g(op, 'description')) + '</div>';
        var sug = g(op, 'suggestions', []);
        if (sug.length) {
          html += '<div class="opp-s">';
          sug.forEach(function (s) { html += '<span>' + S(s) + '</span>'; });
          html += '</div>';
        }
        html += '</div>';
      });
    }

    var tKeys = Object.keys(tasks);
    if (tKeys.length) {
      html += '<div class="sec">任务 · ' + tKeys.length + '</div>';
      var order = { '进行中': 0, '已完成': 1, '已失败': 2 };
      tKeys.map(function (k) { return tasks[k]; })
        .sort(function (a, b) { return (order[g(a, 'status')] || 9) - (order[g(b, 'status')] || 9); })
        .forEach(function (t) {
          var st = g(t, 'status', '');
          var cls = st === '已完成' ? 'done' : st === '已失败' ? 'fail' : '';
          html += '<div class="task">';
          html += '<span class="dot ' + cls + '"></span>';
          html += '<div class="body"><div class="name">' + S(g(t, 'name')) + '</div>';
          html += '<div class="meta">' + S(g(t, 'type')) + (g(t, 'goal') ? ' · ' + S(g(t, 'goal')).slice(0, 24) : '') + '</div></div>';
          html += '<span class="badge ' + cls + '">' + st + '</span>';
          html += '</div>';
        });
    }

    var iKeys = Object.keys(items);
    if (iKeys.length) {
      html += '<div class="sec">物品 · ' + iKeys.length + '</div><div class="items">';
      iKeys.forEach(function (k) {
        var it = items[k];
        html += '<div class="item"><span class="n">' + S(g(it, 'name', k)) + '</span><span class="q">×' + g(it, 'quantity', 1) + '</span></div>';
      });
      html += '</div>';
    }

    if (!html) html = empty('暂无状态', '变量初始化后将显示人物与任务');
    document.getElementById('panel-state').innerHTML = html;
  }

  function renderMap(d) {
    var html = '';
    var cur = g(d, 'situation.current', '');
    var locLib = g(d, 'world.location_library', {}) || {};
    var regions = g(d, 'world.known_regions', {}) || {};
    var rep = g(d, 'reputation', {}) || {};

    html += '<div class="sec">当前位置</div>';
    if (cur) {
      html += '<div class="loc"><div class="loc-n">' + S(cur) + '</div></div>';
    } else {
      html += '<div class="loc"><div class="loc-n" style="color:var(--dim)">未知</div></div>';
    }

    var locs = Object.keys(locLib);
    if (locs.length) {
      html += '<div class="sec">已知地点 · ' + locs.length + '</div>';
      locs.forEach(function (k) {
        var v = locLib[k];
        html += '<div class="loc"><div class="loc-n">' + S(g(v, 'name', k)) + '</div>';
        if (g(v, 'description')) html += '<div class="loc-d">' + S(g(v, 'description')) + '</div>';
        html += '</div>';
      });
    }

    var regs = Object.keys(regions);
    if (regs.length) {
      html += '<div class="sec">已探索区域 · ' + regs.length + '</div>';
      regs.forEach(function (k) {
        var v = regions[k];
        html += '<div class="loc"><div class="loc-n">' + S(g(v, 'name') || k) + '</div>';
        if (g(v, 'description')) html += '<div class="loc-d">' + S(g(v, 'description')) + '</div>';
        html += '</div>';
      });
    }

    var rKeys = Object.keys(rep);
    if (rKeys.length) {
      html += '<div class="sec">声望</div><div class="chips">';
      rKeys.forEach(function (k) {
        var v = rep[k];
        var val = g(v, 'value', 0);
        var color = val >= 0 ? 'var(--ok)' : 'var(--bad)';
        html += '<span class="chip" style="color:' + color + '">' + S(g(v, 'label', k)) + ' ' + (val > 0 ? '+' : '') + val + '</span>';
      });
      html += '</div>';
    }

    if (!locs.length && !regs.length && !cur) {
      html = empty('地图尚未展开', '探索后，地点与区域会出现在这里');
    }
    document.getElementById('panel-map').innerHTML = html;
  }

  function renderRel(d) {
    var rels = g(d, 'npc_relations', {}) || {};
    var sexual = g(d, 'sexual', {}) || {};
    var keys = Object.keys(rels);
    setCount('cntRel', keys.length);

    if (!keys.length) {
      document.getElementById('panel-rel').innerHTML = empty('暂无人物档案', '与 NPC 深入互动后会出现在这里');
      return;
    }

    keys.sort(function (a, b) {
      return g(rels[b], 'impression', 0) - g(rels[a], 'impression', 0);
    });

    var html = '';
    keys.forEach(function (k) {
      var v = rels[k];
      var name = g(v, 'name', '?');
      var imp = g(v, 'impression', 0);
      var rel = g(v, 'relationship', '');
      var known = g(v, 'known_since', '');
      var ctx = g(v, 'context', {});
      var sx = sexual[k];
      var statusStr = sx ? S(g(sx, 'relationship_status', '')) : '';
      var color = impColor(imp);

      html += '<details class="person">';
      html += '<summary>';
      html += '<div class="av">' + emoji(imp) + '</div>';
      html += '<div class="info"><div class="nm">' + S(name);
      if (statusStr) html += '<span class="tag">' + statusStr + '</span>';
      html += '</div><div class="rel">' + S(rel) + (known ? ' · 自 ' + known : '') + '</div></div>';
      html += '<div class="imp" style="color:' + color + '">' + imp + '</div>';
      html += '</summary>';

      html += '<div class="detail">';
      html += '<div class="bar"><i style="width:' + impPct(imp) + '%;background:' + color + '"></i></div>';
      if (g(ctx, 'current_mood')) html += kv('情绪', S(g(ctx, 'current_mood')));
      if (g(ctx, 'attitude_reason')) html += kv('缘由', S(g(ctx, 'attitude_reason')));
      if (g(ctx, 'relationship_goal')) html += kv('期望', S(g(ctx, 'relationship_goal')));
      var taboos = g(ctx, 'taboos', []);
      if (taboos.length) html += kv('禁忌', taboos.join('；'));
      var promises = g(ctx, 'unresolved_promises', []);
      if (promises.length) html += kv('未了约定', promises.join('；'));
      if (sx) {
        html += '<div style="height:1px;background:var(--line);margin:6px 0"></div>';
        html += kv('亲密状态', S(g(sx, 'relationship_status')));
        html += kv('Virgin', g(sx, 'virgin', true) ? '是' : '否');
        html += kv('Body Count', S(g(sx, 'body_count', 0)));
      }
      html += '</div></details>';
    });

    document.getElementById('panel-rel').innerHTML = html;
  }

  function renderAssets(d) {
    var ass = g(d, 'assets', {}) || {};
    var html = '';
    var cash = g(ass, 'cash');
    var bank = g(ass, 'bank');

    html += '<div class="wallet">';
    html += '<div class="box"><div class="lbl">现金</div><div class="val">¥' + money(cash) + '</div></div>';
    html += '<div class="box"><div class="lbl">银行存款</div><div class="val">¥' + money(bank) + '</div></div>';
    html += '</div>';

    var companies = g(ass, 'companies', {}) || {};
    var ck = Object.keys(companies);
    if (ck.length) {
      html += '<div class="sec">公司 / 股份</div>';
      ck.forEach(function (k) {
        var c = companies[k];
        html += '<div class="asset-row"><span class="l">' + S(g(c, 'name', k)) + '</span><span class="r">' + S(g(c, 'shares', '')) + '</span></div>';
      });
    }

    var estates = g(ass, 'estates', {}) || {};
    var ek = Object.keys(estates);
    if (ek.length) {
      html += '<div class="sec">房产</div>';
      ek.forEach(function (k) {
        var e = estates[k];
        html += '<div class="asset-row"><span class="l">' + S(g(e, 'name', k)) + '</span><span class="r">' + S(g(e, 'address', '')) + '</span></div>';
        if (g(e, 'area')) html += '<div class="asset-sub"><span>面积</span><span>' + S(g(e, 'area')) + '</span></div>';
        if (g(e, 'value')) html += '<div class="asset-sub"><span>估值</span><span>¥' + money(g(e, 'value')) + '</span></div>';
      });
    }

    var vehicles = g(ass, 'vehicles', {}) || {};
    var vk = Object.keys(vehicles);
    if (vk.length) {
      html += '<div class="sec">车辆</div>';
      vk.forEach(function (k) {
        var v = vehicles[k];
        html += '<div class="asset-row"><span class="l">' + S(g(v, 'name', k)) + '</span><span class="r">' + S(g(v, 'plate', '')) + '</span></div>';
      });
    }

    document.getElementById('panel-assets').innerHTML = html;
  }

  function renderWx(d) {
    var rels = g(d, 'npc_relations', {}) || {};
    var keys = Object.keys(rels);
    setCount('cntWx', keys.length);

    if (!keys.length) {
      document.getElementById('panel-wx').innerHTML = empty('通讯录为空', '认识新朋友后会出现在这里');
      return;
    }

    var sorted = keys.map(function (k) {
      return { key: k, val: rels[k], since: g(rels[k], 'known_since', '2000-01-01') };
    }).sort(function (a, b) { return b.since.localeCompare(a.since); });

    var html = '';
    sorted.slice(0, 24).forEach(function (item) {
      var v = item.val;
      var imp = g(v, 'impression', 0);
      var mood = g(v, 'context.current_mood', '');
      html += '<div class="contact">';
      html += '<div class="av">' + emoji(imp) + '</div>';
      html += '<div class="body">';
      html += '<div class="nm">' + S(g(v, 'name', '?')) + '<span class="role">' + S(g(v, 'relationship', '')) + '</span></div>';
      html += '<div class="preview">' + (mood ? S(mood) : '暂无近况') + '</div>';
      if (g(v, 'known_since')) html += '<div class="when">结识于 ' + g(v, 'known_since') + '</div>';
      html += '</div></div>';
    });

    document.getElementById('panel-wx').innerHTML = html;
  }

  function renderGeass(d) {
    var geass = g(d, 'geass', {}) || {};
    var keys = Object.keys(geass);
    setCount('cntGeass', keys.length);

    if (!keys.length) {
      document.getElementById('panel-geass').innerHTML = empty('尚未获得言灵', '特殊能力到手后会显示在此');
      return;
    }

    var html = '';
    keys.forEach(function (k) {
      var v = geass[k];
      html += '<div class="geass">';
      html += '<div class="geass-top"><span class="geass-name">' + S(g(v, 'name')) + '</span>';
      if (g(v, 'type')) html += '<span class="geass-type">' + S(g(v, 'type')) + '</span>';
      html += '</div>';
      if (g(v, 'description')) html += '<div class="geass-d">' + S(g(v, 'description')) + '</div>';
      html += '<div class="geass-m">已使用 ' + S(g(v, 'total_uses', 0)) + ' 次</div>';
      html += '</div>';
    });
    document.getElementById('panel-geass').innerHTML = html;
  }

  function render(data) {
    if (!data) {
      document.querySelectorAll('.panel').forEach(function (p) {
        p.innerHTML = empty('等待数据', 'MVU 初始化后自动刷新');
      });
      document.getElementById('hdrDate').textContent = '—';
      document.getElementById('hdrSub').innerHTML = '穿越第 <span>—</span> 天';
      document.getElementById('hdrSit').style.display = 'none';
      resize();
      return;
    }
    renderHeader(data);
    renderState(data);
    renderMap(data);
    renderRel(data);
    renderAssets(data);
    renderWx(data);
    renderGeass(data);
    resize();
  }

  var hasRendered = false;

  function getMvuRef() {
    try { if (typeof Mvu !== 'undefined' && Mvu.getMvuData) return Mvu; } catch (e) {}
    try { if (parent && parent.Mvu && parent.Mvu.getMvuData) return parent.Mvu; } catch (e) {}
    try { if (parent && parent.parent && parent.parent.Mvu && parent.parent.Mvu.getMvuData) return parent.parent.Mvu; } catch (e) {}
    return null;
  }

  function unwrap(sd) {
    if (!sd || typeof sd !== 'object') return sd;
    if (sd.stat_data && typeof sd.stat_data === 'object' && sd.stat_data.user) return sd.stat_data;
    return sd;
  }

  function getStatData() {
    var m = getMvuRef();
    if (m) {
      try {
        var data = m.getMvuData({ type: 'chat' });
        if (data && data.stat_data) return unwrap(data.stat_data);
      } catch (e) {}
    }
    try {
      if (typeof getVariables === 'function') {
        var v = getVariables({ type: 'chat' });
        if (v && v.stat_data) return unwrap(v.stat_data);
        if (v && v.user) return unwrap(v);
      }
    } catch (e) {}
    return null;
  }

  function setDemo(on) {
    document.getElementById('demo').style.display = on ? 'block' : 'none';
  }

  function init() {
    var sd = getStatData();
    if (sd) {
      setDemo(false);
      render(sd);
      hasRendered = true;
    } else {
      setDemo(true);
      render(DEMO);
    }

    var m = getMvuRef();
    if (m) {
      try {
        m.on('mag_variable_update_ended', function () {
          setTimeout(function () {
            var d = getStatData();
            if (d) { setDemo(false); render(d); hasRendered = true; }
          }, 400);
        });
        m.on('mag_variable_initiailized', function () {
          setTimeout(function () {
            var d = getStatData();
            if (d) { setDemo(false); render(d); hasRendered = true; }
          }, 1200);
        });
      } catch (e) {}
    }

    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'sb-data') return;
      var d = unwrap(e.data.stat_data);
      if (d) { setDemo(false); render(d); hasRendered = true; }
    });

    if (!hasRendered) {
      var ft = setInterval(function () {
        var d = getStatData();
        if (d) {
          setDemo(false);
          render(d);
          hasRendered = true;
          clearInterval(ft);
        }
      }, 2500);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(init, 200); });
  } else {
    setTimeout(init, 200);
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab) return;
    var name = tab.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.remove('active'); });
    tab.classList.add('active');
    document.querySelectorAll('.panel').forEach(function (p) { p.classList.remove('active'); });
    var panel = document.getElementById('panel-' + name);
    if (panel) panel.classList.add('active');
    resize();
  });
})();
</script>
</body>
</html>
