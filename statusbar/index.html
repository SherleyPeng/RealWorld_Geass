<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>真实世界·状态栏</title>
<style>
:root {
  --bg: #0d0f14;
  --panel: #141820;
  --card: #1a1f2a;
  --card2: #222833;
  --border: #2a3344;
  --text: #e8ecf4;
  --muted: #8b95a8;
  --dim: #5c677a;
  --accent: #c9a227;
  --accent2: #e8c547;
  --pink: #e879a9;
  --blue: #5b9fd4;
  --green: #5ecf8e;
  --orange: #e8a55a;
  --red: #e86a6a;
  --radius: 10px;
  --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: transparent;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
#app {
  background: linear-gradient(165deg, #12151c 0%, #0d0f14 100%);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,.45);
  height: 520px;
  max-height: 520px;
  display: flex;
  flex-direction: column;
  transition: height .2s ease, max-height .2s ease;
}
#app.collapsed {
  height: 44px;
  max-height: 44px;
}
#app.collapsed .tabs,
#app.collapsed .panel,
#app.collapsed .demo-banner {
  display: none !important;
}
#app.collapsed .topbar {
  border-bottom: none;
}
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  background: linear-gradient(90deg, #1a1520 0%, #141820 50%, #121820 100%);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
}
.topbar .brand {
  font-size: 13px;
  letter-spacing: .12em;
  color: var(--accent);
  font-weight: 600;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}
.topbar .brand .toggle-icon {
  display: inline-block;
  font-size: 12px;
  color: var(--dim);
  transition: transform .15s;
  line-height: 1;
}
#app:not(.collapsed) .topbar .brand .toggle-icon {
  transform: rotate(90deg);
}
.topbar .chips {
  display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end;
}
.chip {
  font-size: 13px;
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--card2);
  border: 1px solid var(--border);
  color: var(--muted);
  white-space: nowrap;
}
.chip strong { color: var(--accent2); font-weight: 600; }

.tabs {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  gap: 0;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  scrollbar-width: none;
  flex-shrink: 0;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 1 0 auto;
  min-width: 56px;
  padding: 10px 12px;
  text-align: center;
  font-size: 14px;
  color: var(--muted);
  cursor: pointer;
  border: none;
  background: transparent;
  border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s, background .15s;
  position: relative;
}
.tab:hover { color: var(--text); background: rgba(255,255,255,.03); }
.tab.active {
  color: var(--accent2);
  border-bottom-color: var(--accent);
  font-weight: 600;
}
.tab .badge {
  position: absolute;
  top: 4px; right: 4px;
  min-width: 16px; height: 16px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--accent);
  color: #111;
  font-size: 11px;
  font-weight: 700;
  line-height: 16px;
}

.panel {
  display: none;
  padding: 14px;
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  background: var(--bg);
  box-sizing: border-box;
}
.panel.active { display: block; }
.panel::-webkit-scrollbar { width: 6px; }
.panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.section-title {
  font-size: 13px;
  color: var(--dim);
  letter-spacing: .08em;
  margin: 12px 0 8px;
  text-transform: uppercase;
}
.section-title:first-child { margin-top: 0; }

.kv {
  display: grid;
  grid-template-columns: 78px 1fr;
  gap: 5px 12px;
  margin-bottom: 7px;
}
.kv .k { color: var(--dim); font-size: 14px; }
.kv .v { color: var(--text); word-break: break-word; font-size: 14px; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 10px;
}
.card h3 {
  font-size: 15px;
  font-weight: 600;
  color: var(--accent2);
  margin-bottom: 8px;
}
.muted { color: var(--muted); }
.dim { color: var(--dim); }
.accent { color: var(--accent2); }
.pink { color: var(--pink); }
.green { color: var(--green); }
.blue { color: var(--blue); }
.orange { color: var(--orange); }
.red { color: var(--red); }
.mono { font-variant-numeric: tabular-nums; }

.fold {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--card);
  margin-bottom: 8px;
  overflow: hidden;
}
.fold > summary {
  list-style: none;
  cursor: pointer;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  user-select: none;
  background: var(--card2);
}
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::after {
  content: "▸";
  color: var(--dim);
  font-size: 13px;
  transition: transform .15s;
}
.fold[open] > summary::after { transform: rotate(90deg); }
.fold > summary .title {
  font-weight: 600;
  font-size: 15px;
  color: var(--text);
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.fold > summary .meta { color: var(--muted); font-size: 13px; }
.fold-body { padding: 12px 14px 14px; border-top: 1px solid var(--border); }

.stat-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 10px;
}
.stat-cell {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  text-align: center;
}
.stat-cell .n {
  font-size: 17px;
  font-weight: 700;
  color: var(--accent2);
  font-variant-numeric: tabular-nums;
}
.stat-cell .n.pink { color: var(--pink); }
.stat-cell .l { font-size: 12px; color: var(--dim); margin-top: 3px; }

.tag {
  display: inline-block;
  font-size: 12px;
  padding: 2px 7px;
  border-radius: 4px;
  background: rgba(201,162,39,.15);
  color: var(--accent2);
  border: 1px solid rgba(201,162,39,.35);
}
.tag.pink {
  background: rgba(232,121,169,.12);
  color: var(--pink);
  border-color: rgba(232,121,169,.3);
}
.tag.blue {
  background: rgba(91,159,212,.12);
  color: var(--blue);
  border-color: rgba(91,159,212,.3);
}
.tag.green {
  background: rgba(94,207,142,.12);
  color: var(--green);
  border-color: rgba(94,207,142,.3);
}

.msg {
  padding: 7px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 14px;
}
.msg:last-child { border-bottom: none; }
.msg .when { color: var(--dim); font-size: 12px; margin-bottom: 2px; }
.msg.out .body { color: var(--blue); }
.msg.in .body { color: var(--text); }

.empty {
  text-align: center;
  padding: 32px 14px;
  color: var(--dim);
  font-size: 14px;
}
.empty .ico { font-size: 24px; margin-bottom: 8px; opacity: .5; }

.money { color: var(--green); font-weight: 600; font-variant-numeric: tabular-nums; }
.row-list { list-style: none; }
.row-list li {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  gap: 8px;
}
.row-list li:last-child { border-bottom: none; }

.demo-banner {
  font-size: 12px;
  text-align: center;
  padding: 4px;
  background: rgba(232,106,106,.15);
  color: var(--red);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.body-block {
  margin-top: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  background: var(--card);
}
.body-block > .bh {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 12px;
  background: var(--card2);
  border-bottom: 1px solid var(--border);
  font-size: 14px;
  font-weight: 600;
  color: var(--accent2);
}
.body-block > .bh .tags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  font-weight: 400;
  margin-left: auto;
  justify-content: flex-end;
}
.body-block > .bh .tags .tag {
  font-size: 12px;
}
.body-block > .bh .dev {
  display: flex;
  align-items: center;
  gap: 6px;
  width: 100%;
  margin-top: 2px;
  font-weight: 400;
  font-size: 12px;
  color: var(--dim);
}
.body-block > .bh .dev .bar {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  background: rgba(255,255,255,.06);
  overflow: hidden;
  min-width: 60px;
}
.body-block > .bh .dev .bar > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--pink), var(--accent2));
}
.body-block > .bh .dev .pct {
  font-variant-numeric: tabular-nums;
  color: var(--pink);
  min-width: 36px;
  text-align: right;
}
.body-block > .bd {
  padding: 10px 12px;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.55;
}
.body-block > .bd:empty { display: none; }
.body-block > .btype {
  padding: 8px 12px 0;
  font-size: 13px;
  color: var(--text);
  line-height: 1.5;
  border-bottom: 1px dashed var(--border);
  padding-bottom: 8px;
  margin: 0 0 0;
}
.body-block > .btype .bt-label {
  display: block;
  font-size: 12px;
  color: var(--accent2);
  margin-bottom: 3px;
  font-weight: 600;
}
.body-block > .bstate {
  padding: 8px 12px 10px;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.55;
}
.body-block > .bstate .bs-label {
  display: block;
  font-size: 12px;
  color: var(--dim);
  margin-bottom: 3px;
  font-weight: 600;
}

.aff-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin: 8px 0 4px;
}
.aff-item {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
}
.aff-item .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 5px;
  font-size: 13px;
}
.aff-item .row .lab { color: var(--muted); }
.aff-item .row .val {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.aff-item .bar {
  height: 6px;
  border-radius: 999px;
  background: rgba(255,255,255,.06);
  overflow: hidden;
}
.aff-item .bar > i {
  display: block;
  height: 100%;
  border-radius: 999px;
}
.aff-item.love .val { color: var(--pink); }
.aff-item.love .bar > i { background: var(--pink); }
.aff-item.hate .val { color: var(--red); }
.aff-item.hate .bar > i { background: var(--red); }
.aff-item.sub .val { color: var(--accent2); }
.aff-item.sub .bar > i { background: var(--accent2); }
.aff-item.friend .val { color: var(--blue); }
.aff-item.friend .bar > i { background: var(--blue); }

.cloth-grid {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 4px 10px;
  margin-top: 2px;
  font-size: 14px;
}
.cloth-grid .ck { color: var(--dim); }
.cloth-grid .cv { color: var(--muted); word-break: break-word; }
</style>
</head>
<body>
<div id="app" class="collapsed">
  <div id="demoBanner" class="demo-banner" style="display:none">演示数据 · 等待 MVU 变量</div>
  <div class="topbar" id="topbarToggle" title="点击展开/折叠状态栏">
    <div class="brand"><span class="toggle-icon">▸</span> REAL WORLD</div>
    <div class="chips">
      <span class="chip" id="chipDate">—</span>
      <span class="chip" id="chipCash">现金 <strong id="chipCashVal">—</strong></span>
      <span class="chip" id="chipLoc">—</span>
    </div>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="role">角色</button>
    <button class="tab" data-tab="map">地图</button>
    <button class="tab" data-tab="harem">后宫<span class="badge" id="badgeHarem" style="display:none">0</span></button>
    <button class="tab" data-tab="acquaint">熟人<span class="badge" id="badgeAcq" style="display:none">0</span></button>
    <button class="tab" data-tab="assets">资产</button>
    <button class="tab" data-tab="wx">微信<span class="badge" id="badgeWx" style="display:none">0</span></button>
    <button class="tab" data-tab="geass">言灵<span class="badge" id="badgeGeass" style="display:none">0</span></button>
  </div>
  <div class="panel active" id="panel-role"></div>
  <div class="panel" id="panel-map"></div>
  <div class="panel" id="panel-harem"></div>
  <div class="panel" id="panel-acquaint"></div>
  <div class="panel" id="panel-assets"></div>
  <div class="panel" id="panel-wx"></div>
  <div class="panel" id="panel-geass"></div>
</div>

<script>
(function () {
  'use strict';

  var state = null;
  var isDemo = false;
  /** 记住已展开的 details，避免定时重绘导致立刻折叠 */
  var openFolds = {};

  function $(id) { return document.getElementById(id); }

  function g(obj, path, def) {
    if (obj == null) return def;
    var parts = path.split('.');
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return def;
      cur = cur[parts[i]];
    }
    if (cur === undefined || cur === null || cur === '') return def;
    // MagVU [value, desc] pair
    if (Array.isArray(cur) && cur.length >= 1 && (typeof cur[0] !== 'object' || cur[0] === null)) {
      return cur[0] === undefined || cur[0] === null ? def : cur[0];
    }
    return cur;
  }

  function unwrap(data) {
    if (!data) return null;
    var sd = data.stat_data || data;
    // double nest
    if (sd && sd.stat_data && (sd.stat_data.user || sd.stat_data.time)) {
      sd = sd.stat_data;
    }
    if (data.display_data) {
      var dd = data.display_data;
      if (dd.stat_data && (dd.stat_data.user || dd.stat_data.time)) dd = dd.stat_data;
    }
    return sd;
  }

  function calcAge(birth, nowDate) {
    if (!birth || !nowDate) return '—';
    try {
      var b = birth.split('-').map(Number);
      var n = nowDate.split('-').map(Number);
      var age = n[0] - b[0];
      if (n[1] < b[1] || (n[1] === b[1] && n[2] < b[2])) age--;
      return age >= 0 ? age : '—';
    } catch (e) { return '—'; }
  }

  function money(n) {
    if (typeof n !== 'number' || isNaN(n)) return '—';
    return n.toLocaleString('zh-CN', { maximumFractionDigits: 2 }) + ' 元';
  }

  function entries(obj) {
    if (!obj || typeof obj !== 'object') return [];
    return Object.keys(obj).filter(function (k) {
      return k !== '$meta' && obj[k] != null;
    }).map(function (k) {
      return { key: k, val: obj[k] };
    });
  }

  function esc(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function withUserSexCount(sx) {
    if (!sx) return 0;
    var c = g(sx, 'with_user.total', null);
    if (typeof c === 'number') return c;
    c = g(sx, 'with_user_count', null);
    if (typeof c === 'number') return c;
    var w = g(sx, 'with_user', {});
    if (w && typeof w === 'object') {
      var sum = 0;
      ['vaginal', 'oral', 'breast', 'anal', 'service', 'creampie', 'total'].forEach(function (k) {
        if (k !== 'total' && typeof w[k] === 'number') sum += w[k];
      });
      if (typeof w.total === 'number') return w.total;
      return sum;
    }
    return 0;
  }

  /** 恋爱/包养等亲密关系关键词（无性交也可进后宫） */
  var HAREM_REL_RE = /恋人|女友|男朋友|后宫|情人|包养|被包养|金主|奴隶|宠物|禁脔|炮友|妻子|未婚妻|老婆|订婚|同居|暧昧对象|男女朋友/;

  function isIntimateRel(rel) {
    return HAREM_REL_RE.test(String(rel || ''));
  }

  /** 是否收入后宫：女性 +（与主角有过性 或 亲密恋爱/包养等关系） */
  function isHaremMember(npcKey, sd) {
    var rels = g(sd, 'npc_relations', {});
    var sexual = g(sd, 'sexual', {});
    var npc = g(rels, npcKey, {}) || {};
    var sx = g(sexual, npcKey, null) || {};
    var gender = g(npc, 'gender', '') || g(sx, 'gender', '');
    if (gender === '男') return false;
    // 无 gender 时：有 sexual 条目或关系词命中则按女性处理
    var rel = g(npc, 'relationship', '') || g(sx, 'relationship', '');
    if (withUserSexCount(sx) >= 1) return true;
    if (isIntimateRel(rel)) return true;
    return false;
  }

  function saveOpenFolds(panelId) {
    var panel = $(panelId);
    if (!panel) return;
    panel.querySelectorAll('details.fold[data-fold-id]').forEach(function (d) {
      var id = d.getAttribute('data-fold-id');
      if (id) openFolds[id] = d.open;
    });
  }

  function restoreOpenFolds(panelId) {
    var panel = $(panelId);
    if (!panel) return;
    panel.querySelectorAll('details.fold[data-fold-id]').forEach(function (d) {
      var id = d.getAttribute('data-fold-id');
      if (id && openFolds[id]) d.open = true;
    });
  }

  function bindFoldListeners(panelId) {
    var panel = $(panelId);
    if (!panel) return;
    panel.querySelectorAll('details.fold[data-fold-id]').forEach(function (d) {
      d.addEventListener('toggle', function () {
        var id = d.getAttribute('data-fold-id');
        if (id) openFolds[id] = d.open;
      });
    });
  }

  /* ---------- tabs ---------- */
  document.getElementById('tabs').addEventListener('click', function (e) {
    var btn = e.target.closest('.tab');
    if (!btn) return;
    var id = btn.getAttribute('data-tab');
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t === btn); });
    document.querySelectorAll('.panel').forEach(function (p) {
      p.classList.toggle('active', p.id === 'panel-' + id);
    });
    postHeight();
  });

  /* ---------- renderers ---------- */
  function renderTop(sd) {
    var date = g(sd, 'time.current_date', '—');
    var time = g(sd, 'time.current_time', '');
    $('chipDate').textContent = time ? (date + ' ' + time) : date;
    $('chipCashVal').textContent = money(g(sd, 'assets.cash', 0));
    var loc = g(sd, 'situation.place', '') || g(sd, 'situation.current', '—');
    if (loc.length > 18) loc = loc.slice(0, 18) + '…';
    $('chipLoc').textContent = loc;
  }

  function renderRole(sd) {
    var u = g(sd, 'user', {});
    var birth = g(u, 'birth_date', '');
    var age = calcAge(birth, g(sd, 'time.current_date', ''));
    var identity = g(u, 'identity', '') || g(u, 'background.current_status', '—');
    var classLabel = g(u, 'social_class', '') || '';
    var repParts = [];
    entries(g(sd, 'reputation', {})).forEach(function (e) {
      var label = g(e.val, 'label', e.key);
      var val = g(e.val, 'value', '');
      repParts.push(label + (val !== '' ? '(' + val + ')' : ''));
    });
    var loc = g(sd, 'situation.place', '') || g(sd, 'situation.current', '—');
    var bank = g(sd, 'assets.bank', 0);
    var cash = g(sd, 'assets.cash', 0);
    var wealthHint = '';
    var total = (typeof bank === 'number' ? bank : 0) + (typeof cash === 'number' ? cash : 0);
    // also sum banks
    var banks = g(sd, 'assets.banks', {});
    entries(banks).forEach(function (e) {
      var bal = g(e.val, 'balance', e.val);
      if (typeof bal === 'number') total += bal;
    });
    if (total >= 1e8) wealthHint = '超级富豪';
    else if (total >= 1e7) wealthHint = '富豪';
    else if (total >= 1e6) wealthHint = '高净值';
    else if (total >= 1e5) wealthHint = '小康偏上';
    else if (total >= 1e4) wealthHint = '普通工薪';
    else wealthHint = '经济紧张';

    var html = '';
    html += '<div class="card">';

  /** 从 body 部位对象取出标签列表 + 描写正文 + 开发度 */
  function parseBodyPart(obj, tagKeys) {
    if (obj == null || obj === '') return null;
    if (typeof obj === 'string' || typeof obj === 'number') {
      return { tags: [], typeDesc: '', state: String(obj), development: 0 };
    }
    if (typeof obj !== 'object') return null;
    // 名器图鉴长文 / 类型说明字段，不进标签
    var skip = {
      description:1, desc:1, detail:1, $meta:1,
      development:1, dev:1, 开发度:1,
      type_desc:1, type_description:1, catalog_desc:1, catalog:1,
      名器描述:1, 类型描述:1, 图鉴:1, lore:1, entry:1
    };
    var tags = [];
    (tagKeys || Object.keys(obj)).forEach(function (k) {
      if (skip[k]) return;
      var v = obj[k];
      if (v == null || v === '') return;
      if (typeof v === 'object') return;
      tags.push(String(v));
    });
    Object.keys(obj).forEach(function (k) {
      if (skip[k]) return;
      if (tagKeys && tagKeys.indexOf(k) >= 0) return;
      var v = obj[k];
      if (v == null || v === '' || typeof v === 'object') return;
      if (tags.indexOf(String(v)) < 0) tags.push(String(v));
    });
    // 名器类型详述（引用「名器生成1.1」对应条目文本）
    var typeDesc = g(obj, 'type_desc', '')
      || g(obj, 'type_description', '')
      || g(obj, 'catalog_desc', '')
      || g(obj, 'catalog', '')
      || g(obj, '名器描述', '')
      || g(obj, '类型描述', '')
      || g(obj, '图鉴', '')
      || g(obj, 'lore', '')
      || '';
    // 当前个体状态描写
    var state = g(obj, 'description', '') || g(obj, 'desc', '') || g(obj, 'detail', '') || '';
    var dev = g(obj, 'development', null);
    if (dev == null) dev = g(obj, 'dev', null);
    if (dev == null) dev = g(obj, '开发度', 0);
    dev = Math.max(0, Math.min(100, Number(dev) || 0));
    if (!tags.length && !typeDesc && !state && !dev) return null;
    return { tags: tags, typeDesc: typeDesc, state: state, development: dev };
  }

    var list = collectHaremKeys(sd);

    $('badgeHarem').style.display = list.length ? 'inline-block' : 'none';
    $('badgeHarem').textContent = list.length;

    if (!list.length) {
      $('panel-harem').innerHTML = '<div class="empty"><div class="ico">♡</div>暂无后宫成员<br><span class="dim">恋人 / 情人 / 包养等关系，或与主角发生性关系后收入</span></div>';
      return;
    }

    var html = '';
    list.forEach(function (key) {
      // 保证有 sexual 壳也可展示；数据从 rels + sexual 合并读
      html += npcDetailCard(key, sd, 'harem');
    });
    $('panel-harem').innerHTML = html;
    restoreOpenFolds('panel-harem');
    bindFoldListeners('panel-harem');
  }

  function renderAcquaint(sd) {
    saveOpenFolds('panel-acquaint');

    var rels = g(sd, 'npc_relations', {});
    var sexual = g(sd, 'sexual', {});
    var list = [];
    entries(rels).forEach(function (e) {
      if (isHaremMember(e.key, sd)) return; // 后宫不进熟人
      list.push(e);
    });

    $('badgeAcq').style.display = list.length ? 'inline-block' : 'none';
    $('badgeAcq').textContent = list.length;

    if (!list.length) {
      $('panel-acquaint').innerHTML = '<div class="empty"><div class="ico">◎</div>暂无熟人记录</div>';
      return;
    }

    var html = '';
    list.forEach(function (e) {
      // 男女统一姓名折叠，避免列表过长；男性不展示私密 body_specs
      html += npcDetailCard(e.key, sd, 'acq');
    });
    $('panel-acquaint').innerHTML = html;
    restoreOpenFolds('panel-acquaint');
    bindFoldListeners('panel-acquaint');
  }

  function renderAssets(sd) {
    var a = g(sd, 'assets', {});
    var cash = g(a, 'cash', 0);
    var bank = g(a, 'bank', 0);
    var banks = g(a, 'banks', null);

    var html = '<div class="card"><h3>流动资金</h3>';
    html += '<div class="kv"><div class="k">现金</div><div class="v money">' + money(cash) + '</div></div>';

    var bankList = entries(banks || {});
    if (bankList.length) {
      bankList.forEach(function (e) {
        var nm = g(e.val, 'name', e.key);
        // 纠正明显错误的「私人银行」标签（若数据里仍是旧名则原样显示）
        var bal = g(e.val, 'balance', e.val);
        if (typeof bal === 'object') bal = g(e.val, 'balance', 0);
        html += '<div class="kv"><div class="k">' + esc(nm) + '</div><div class="v money">' + money(typeof bal === 'number' ? bal : Number(bal) || 0) + '</div></div>';
      });
    } else if (typeof bank === 'number' && bank > 0) {
      // 兼容旧字段：仅有 assets.bank 时，按「银行存款」展示，不写私人银行
      html += '<div class="kv"><div class="k">银行存款</div><div class="v money">' + money(bank) + '</div></div>';
      html += '<div class="dim" style="font-size:11px">建议拆分为 assets.banks（如 中国银行 / 建设银行 / 工商银行）</div>';
    } else {
      html += '<div class="kv"><div class="k">银行存款</div><div class="v money">' + money(0) + '</div></div>';
    }
    html += '</div>';

    function listBlock(title, obj, fields) {
      var list = entries(obj || {});
      html += '<div class="section-title">' + title + ' · ' + list.length + '</div>';
      if (!list.length) {
        html += '<div class="card dim">暂无</div>';
        return;
      }
      list.forEach(function (e) {
        html += '<div class="card"><strong>' + esc(g(e.val, 'name', e.key)) + '</strong>';
        fields.forEach(function (f) {
          var v = g(e.val, f.key, '');
          if (v === '' || v == null) return;
          if (f.money && typeof v === 'number') v = money(v);
          html += '<div class="kv"><div class="k">' + f.label + '</div><div class="v">' + esc(v) + '</div></div>';
        });
        html += '</div>';
      });
    }

    listBlock('房产', g(a, 'estates', {}), [
      { key: 'address', label: '地址' },
      { key: 'area', label: '面积' },
      { key: 'value', label: '估值', money: true }
    ]);
    listBlock('车产', g(a, 'vehicles', {}), [
      { key: 'plate', label: '车牌' },
      { key: 'color', label: '颜色' }
    ]);
    listBlock('产业', g(a, 'companies', {}), [
      { key: 'shares', label: '持股' },
      { key: 'role', label: '身份' },
      { key: 'value', label: '估值', money: true }
    ]);

    $('panel-assets').innerHTML = html;
  }

  function renderWx(sd) {
    saveOpenFolds('panel-wx');

    var wx = g(sd, 'wechat', {});
    var list = entries(wx);
    $('badgeWx').style.display = list.length ? 'inline-block' : 'none';
    $('badgeWx').textContent = list.length;

    if (!list.length) {
      $('panel-wx').innerHTML = '<div class="empty"><div class="ico">💬</div>暂无微信记录<br><span class="dim">与 NPC 产生信息往来后显示</span></div>';
      return;
    }

    var html = '';
    list.forEach(function (e) {
      var contact = e.val || {};
      var name = g(contact, 'name', e.key);
      var msgs = g(contact, 'messages', []);
      if (!Array.isArray(msgs)) {
        msgs = entries(msgs).map(function (m) { return m.val; });
      }
      msgs = msgs.slice().sort(function (a, b) {
        return String(g(a, 'time', '')).localeCompare(String(g(b, 'time', '')));
      });
      var foldId = 'wx-' + e.key;
      html += '<details class="fold" data-fold-id="' + esc(foldId) + '">';
      html += '<summary><span class="title">' + esc(name) + ' <span class="meta">' + msgs.length + ' 条</span></span></summary>';
      html += '<div class="fold-body">';
      if (!msgs.length) html += '<div class="dim">无消息</div>';
      msgs.forEach(function (m) {
        var dir = g(m, 'dir', g(m, 'from', '')) === 'user' || g(m, 'dir', '') === 'out' ? 'out' : 'in';
        html += '<div class="msg ' + dir + '">';
        html += '<div class="when">' + esc(g(m, 'time', '')) + (dir === 'out' ? ' · 我' : ' · 对方') + '</div>';
        html += '<div class="body">' + esc(g(m, 'text', g(m, 'content', ''))) + '</div>';
        html += '</div>';
      });
      html += '</div></details>';
    });
    $('panel-wx').innerHTML = html;
    restoreOpenFolds('panel-wx');
    bindFoldListeners('panel-wx');
  }

  function renderGeass(sd) {
    saveOpenFolds('panel-geass');

    var geass = g(sd, 'geass', {});
    var list = entries(geass);
    $('badgeGeass').style.display = list.length ? 'inline-block' : 'none';
    $('badgeGeass').textContent = list.length;

    if (!list.length) {
      $('panel-geass').innerHTML = '<div class="empty"><div class="ico">✦</div>尚未使用言灵</div>';
      return;
    }

    var html = '<div class="card"><strong>已使用言灵</strong> · <span class="accent">' + list.length + '</span> 种</div>';
    list.forEach(function (e) {
      var gss = e.val || {};
      var foldId = 'geass-' + e.key;
      html += '<details class="fold" data-fold-id="' + esc(foldId) + '">';
      html += '<summary><span class="title">' + esc(g(gss, 'name', e.key));
      html += ' <span class="tag">' + esc(g(gss, 'type', '')) + '</span>';
      html += ' <span class="meta">×' + esc(g(gss, 'total_uses', 1)) + '</span></span></summary>';
      html += '<div class="fold-body">';
      html += '<div class="muted" style="margin-bottom:8px">' + esc(g(gss, 'description', '')) + '</div>';
      var hist = g(gss, 'use_history', {});
      var uses = entries(hist).sort(function (a, b) {
        return String(g(a.val, 'date', '')).localeCompare(String(g(b.val, 'date', '')));
      });
      if (!uses.length) html += '<div class="dim">无使用记录</div>';
      uses.forEach(function (u) {
        html += '<div class="msg">';
        html += '<div class="when">' + esc(g(u.val, 'date', '')) + (g(u.val, 'time', '') ? ' ' + esc(g(u.val, 'time', '')) : '') + '</div>';
        html += '<div class="body">对 <span class="accent">' + esc(g(u.val, 'target', '')) + '</span>：' + esc(g(u.val, 'effect_desc', '')) + '</div>';
        html += '</div>';
      });
      html += '</div></details>';
    });
    $('panel-geass').innerHTML = html;
    restoreOpenFolds('panel-geass');
    bindFoldListeners('panel-geass');
  }

  var lastDataHash = '';
  function dataHash(sd) {
    try {
      return JSON.stringify(sd);
    } catch (e) {
      return String(Date.now());
    }
  }

  function renderAll(sd) {
    if (!sd) return;
    var h = dataHash(sd);
    // 数据未变时跳过整页重绘，避免折叠被重置（仍允许首次）
    if (h === lastDataHash && state) return;
    lastDataHash = h;
    state = sd;
    renderTop(sd);
    renderRole(sd);
    renderMap(sd);
    renderHarem(sd);
    renderAcquaint(sd);
    renderAssets(sd);
    renderWx(sd);
    renderGeass(sd);
    postHeight();
  }

  /** 固定高度：字号加大后整体抬高，切换 tab 不再抖动 */
  var FIXED_HEIGHT = 520;
  var COLLAPSED_HEIGHT = 44;
  var isCollapsed = true;

  function postHeight() {
    try {
      if (window.parent && window.parent !== window) {
        var h = isCollapsed ? COLLAPSED_HEIGHT : FIXED_HEIGHT;
        window.parent.postMessage({ type: 'realworld-statusbar-resize', height: h }, '*');
      }
    } catch (e) {}
  }

  function setCollapsed(collapsed) {
    isCollapsed = !!collapsed;
    var app = $('app');
    if (!app) return;
    if (isCollapsed) {
      app.classList.add('collapsed');
    } else {
      app.classList.remove('collapsed');
    }
    postHeight();
  }

  function toggleCollapse() {
    setCollapsed(!isCollapsed);
  }

  /* ---------- data source ---------- */
  function tryMvu() {
    try {
      if (typeof parent !== 'undefined' && parent.Mvu && parent.Mvu.getMvuData) {
        var d = parent.Mvu.getMvuData({ type: 'message', message_id: 'latest' })
          || parent.Mvu.getMvuData({ type: 'chat' });
        var sd = unwrap(d);
        if (sd && (sd.user || sd.time || sd.assets)) {
          isDemo = false;
          $('demoBanner').style.display = 'none';
          renderAll(sd);
          return true;
        }
      }
    } catch (e) {}
    try {
      if (typeof parent !== 'undefined' && parent.getVariables) {
        var v = parent.getVariables({ type: 'chat' }) || parent.getVariables();
        var sd2 = unwrap(v);
        if (sd2 && (sd2.user || sd2.time)) {
          isDemo = false;
          $('demoBanner').style.display = 'none';
          renderAll(sd2);
          return true;
        }
      }
    } catch (e2) {}
    return false;
  }

  function demoData() {
    return {
      user: {
        name: '彭少镭', gender: '男', birth_date: '1994-12-21', height: 172,
        appearance: '皮肤白皙，相貌俊秀，身材匀称', clothing_style: '休闲',
        identity: '求职中的建模学员', social_class: '普通青年',
        background: {
          education: '北京火星时代 3D 建模',
          current_status: '求职中',
          residence: '合租单间'
        }
      },
      time: { current_date: '2013-12-14', current_time: '13:05', day_count: 0, weather: '阴冷 · 灰霾' },
      situation: {
        region: '北京 · 海淀',
        place: '合租单间 · 下铺',
        current: '折叠桌前看空邮箱',
        environment: '暖气半热，窗缝漏风，邮箱空空'
      },
      assets: {
        cash: 200,
        bank: 0,
        banks: {
          bank_001: { name: '建设银行', balance: 800 },
          bank_002: { name: '中国银行', balance: 400 }
        },
        companies: {}, estates: {}, vehicles: {}
      },
      geass: {}, npc_relations: {}, sexual: {}, reputation: {}, wechat: {},
      world: { known_regions: {}, location_library: {} },
      _meta: { uid_counters: {} }
    };
  }

  function boot() {
    // 默认折叠
    setCollapsed(true);

    var topbar = $('topbarToggle');
    if (topbar) {
      topbar.addEventListener('click', function (e) {
        // 避免点击 chip 内部文字时误触（仍允许整条 topbar 切换）
        toggleCollapse();
      });
    }

    if (!tryMvu()) {
      isDemo = true;
      $('demoBanner').style.display = 'block';
      renderAll(demoData());
    }
    setInterval(function () { tryMvu(); }, 2000);
    window.addEventListener('message', function (ev) {
      if (!ev.data) return;
      if (ev.data.type === 'realworld-mvu-update' || ev.data.stat_data) {
        var sd = unwrap(ev.data.stat_data ? ev.data : ev.data);
        if (sd) {
          isDemo = false;
          $('demoBanner').style.display = 'none';
          renderAll(sd);
        }
      }
    });
    setTimeout(postHeight, 100);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
