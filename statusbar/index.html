<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg: #0d1117;
  --bg2: #161b22;
  --card: #1c2333;
  --card-hover: #222b3a;
  --border: #30363d;
  --border-accent: rgba(88,166,255,0.3);
  --accent: #58a6ff;
  --accent-glow: rgba(88,166,255,0.15);
  --gold: #d4a853;
  --gold-glow: rgba(212,168,83,0.15);
  --green: #3fb950;
  --green-bg: rgba(63,185,80,0.1);
  --red: #f85149;
  --red-bg: rgba(248,81,73,0.1);
  --pink: #db61a2;
  --pink-bg: rgba(219,97,162,0.1);
  --text: #e6edf3;
  --text2: #8b949e;
  --text3: #484f58;
  --radius: 10px;
  --radius-sm: 6px;
  font: 13px/1.5 'Inter','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
}
body{background:var(--bg);color:var(--text);padding:10px;min-width:260px;max-width:400px}

/* ── Header ── */
.sb-header{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 8px;margin-bottom:2px}
.sb-header .logo{display:flex;align-items:center;gap:8px}
.sb-header .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green)}
.sb-header .logo .title{font-size:13px;font-weight:600;color:var(--text);letter-spacing:0.5px}
.sb-header .time-display{font-size:11px;color:var(--text2);background:var(--card);padding:3px 10px;border-radius:12px;border:1px solid var(--border)}

/* ── Tabs ── */
.tabs{display:flex;gap:3px;padding:4px 2px;border-bottom:1px solid var(--border);margin-bottom:8px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:5px;padding:6px 12px;cursor:pointer;border-radius:var(--radius-sm);font-size:12px;color:var(--text2);transition:all .2s;user-select:none;white-space:nowrap;position:relative}
.tab .ti{font-size:14px;line-height:1}
.tab:hover{color:var(--text);background:var(--card)}
.tab.active{color:var(--accent);background:var(--accent-glow)}
.tab.active::after{content:'';position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);width:16px;height:2px;background:var(--accent);border-radius:1px}

/* ── Panels ── */
.panel{display:none;animation:fadeIn .2s ease}
.panel.active{display:flex;flex-direction:column;gap:6px}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ── Cards ── */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;transition:border-color .2s}
.card:hover{border-color:var(--border-accent)}
.card-header{display:flex;align-items:center;gap:6px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.card-header .ch-icon{font-size:15px}
.card-header .ch-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:1px}

/* ── Stat rows ── */
.stat-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.stat-row+.stat-row{border-top:1px solid rgba(48,54,61,0.5)}
.stat-row .sl{color:var(--text2);font-size:12px;flex-shrink:0;min-width:60px}
.stat-row .sr{color:var(--text);font-size:12px;text-align:right}
.stat-row .sr.highlight{color:var(--accent);font-weight:600}

/* ── Progress bar ── */
.progress-wrap{display:flex;align-items:center;gap:8px}
.progress-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;transition:width .4s ease}
.progress-fill.good{background:var(--green)}
.progress-fill.warm{background:var(--gold)}
.progress-fill.bad{background:var(--red)}
.progress-val{font-size:11px;font-weight:600;min-width:30px;text-align:right}

/* ── Tags/Badges ── */
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:500}
.tag.blue{background:var(--accent-glow);color:var(--accent)}
.tag.gold{background:var(--gold-glow);color:var(--gold)}
.tag.green{background:var(--green-bg);color:var(--green)}
.tag.red{background:var(--red-bg);color:var(--red)}
.tag.pink{background:var(--pink-bg);color:var(--pink)}

/* ── Lover cards ── */
.lover-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:all .2s}
.lover-card:hover{border-color:var(--pink);box-shadow:0 0 8px rgba(219,97,162,0.1)}
.lover-head{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;user-select:none}
.lover-head .avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.lover-head .info{flex:1;min-width:0}
.lover-head .info .name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lover-head .info .meta{font-size:11px;color:var(--text2);display:flex;gap:8px;margin-top:2px}
.lover-head .imp{display:flex;align-items:center;gap:4px;flex-shrink:0}
.lover-head .imp .val{font-size:14px;font-weight:700}
.lover-body{padding:8px 12px 10px;display:none;border-top:1px solid var(--border);font-size:11px;line-height:1.7}
.lover-card.open .lover-body{display:block}
.lover-body .lk{color:var(--text3);margin-right:6px}
.lover-body .lv{color:var(--text)}

/* ── Asset Cards ── */
.asset-card{background:linear-gradient(135deg, var(--card) 0%, #1a2335 100%);border:1px solid var(--border);border-radius:var(--radius);padding:12px;position:relative;overflow:hidden}
.asset-card::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;border-radius:50%;background:var(--accent-glow);opacity:.3;filter:blur(30px)}
.asset-card .ac-label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;position:relative;z-index:1}
.asset-card .ac-value{font-size:22px;font-weight:700;color:var(--text);margin:4px 0;position:relative;z-index:1}
.asset-card .ac-sub{font-size:11px;color:var(--text3);position:relative;z-index:1}

/* ── Mini list ── */
.mini-list{display:flex;flex-direction:column;gap:3px}
.mini-item{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;background:var(--card);border-radius:var(--radius-sm);font-size:12px}
.mini-item .ml{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;margin-right:8px}
.mini-item .mr{color:var(--text2);flex-shrink:0}

/* ── Section title ── */
.section-title{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;padding:4px 2px 2px}

/* ── Placeholder ── */
.placeholder{text-align:center;padding:20px;color:var(--text3);font-size:12px}
.placeholder .ph-icon{font-size:28px;margin-bottom:8px;opacity:.5}
.placeholder .ph-text{line-height:1.6}

/* ── Geass grid ── */
.geass-grid{display:flex;flex-direction:column;gap:4px}
.geass-item{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);transition:all .2s}
.geass-item:hover{border-color:var(--border-accent)}
.geass-item .gi-icon{width:32px;height:32px;border-radius:50%;background:var(--accent-glow);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.geass-item .gi-info{flex:1;min-width:0}
.geass-item .gi-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.geass-item .gi-meta{font-size:10px;color:var(--text2);margin-top:1px}
.geass-item .gi-count{font-size:12px;font-weight:700;color:var(--accent);flex-shrink:0}

/* ── Reputation chips ── */
.rep-row{display:flex;flex-wrap:wrap;gap:4px}
.rep-chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:500}
.rep-chip .rc-dot{width:6px;height:6px;border-radius:50%}
</style>
</head>
<body>

<!-- Header -->
<div class="sb-header">
  <div class="logo">
    <div class="dot"></div>
    <span class="title">言灵穿越</span>
  </div>
  <div class="time-display" id="header-date">--</div>
</div>

<!-- Tabs -->
<div class="tabs" id="tabs">
  <div class="tab active" data-tab="state"><span class="ti">👤</span>状态</div>
  <div class="tab" data-tab="map"><span class="ti">📌</span>地图</div>
  <div class="tab" data-tab="lover"><span class="ti">💕</span>恋人</div>
  <div class="tab" data-tab="assets"><span class="ti">💰</span>资产</div>
  <div class="tab" data-tab="wx"><span class="ti">💬</span>微信</div>
  <div class="tab" data-tab="geass"><span class="ti">✨</span>言灵</div>
</div>

<!-- Panels -->
<div class="panel active" id="panel-state"></div>
<div class="panel" id="panel-map"></div>
<div class="panel" id="panel-lover"></div>
<div class="panel" id="panel-assets"></div>
<div class="panel" id="panel-wx"></div>
<div class="panel" id="panel-geass"></div>

<script>
(function(){
'use strict';

function g(obj, path, def) {
  if (obj == null) return def;
  var parts = path.split('.');
  var cur = obj;
  for (var i = 0; i < parts.length; i++) {
    if (cur == null || typeof cur !== 'object') return def;
    cur = cur[parts[i]];
  }
  return (cur === '' || cur == null) ? def : cur;
}

function safeDisplay(val, maxDepth) {
  if (maxDepth === undefined) maxDepth = 3;
  if (val === null || val === undefined) return '-';
  if (typeof val === 'string') return val || '-';
  if (typeof val === 'number') return val;
  if (typeof val === 'boolean') return val ? '是' : '否';
  if (Array.isArray(val)) {
    if (val.length === 0) return '-';
    if (maxDepth <= 0) return '…';
    return val.map(function(v){return safeDisplay(v, maxDepth-1)}).join(', ');
  }
  if (typeof val === 'object') {
    if (maxDepth <= 0) return '…';
    try { var s = JSON.stringify(val); return s.length > 60 ? s.slice(0,60)+'…' : s; } catch(e){ return '…'; }
  }
  return String(val);
}

function calcAge(birth, current) {
  if (!birth || !current) return null;
  var b = birth.split('-').map(Number);
  var c = current.split('-').map(Number);
  if (b.length !== 3 || c.length !== 3) return null;
  var age = c[0] - b[0];
  if (c[1] < b[1] || (c[1] === b[1] && c[2] < b[2])) age--;
  return age;
}

function impColor(val) {
  if (val >= 51) return 'var(--green)';
  if (val >= 21) return 'var(--accent)';
  if (val >= -20) return 'var(--gold)';
  if (val >= -50) return '#d4773a';
  return 'var(--red)';
}

function impProgress(val) {
  var pct = Math.max(0, Math.min(100, (val + 100) / 2));
  var cls = val >= 50 ? 'good' : val >= 0 ? 'warm' : 'bad';
  return { pct: pct, cls: cls };
}

function render(data) {
  if (!data) {
    document.querySelectorAll('.panel').forEach(function(p){ p.innerHTML = '<div class="placeholder"><div class="ph-icon">⏳</div><div class="ph-text">等待数据同步...</div></div>'; });
    return;
  }
  try {
    renderState(data);
    renderMap(data);
    renderLover(data);
    renderAssets(data);
    renderWx(data);
    renderGeass(data);
    // Update header date
    var el = document.getElementById('header-date');
    if (el && data.time && data.time.current_date) {
      el.textContent = data.time.current_date + '  Day ' + (data.time.day_count || 0);
    }
  } catch(e) {}
  try {
    if (window.parent && window.parent !== window) {
      window.parent.postMessage({ type: 'sb-resize', height: document.body.scrollHeight }, '*');
    }
  } catch(e) {}
}

// ===== 状态 =====
function renderState(d) {
  var h = '';
  var user = g(d, 'user', {});
  var time = g(d, 'time', {});
  var sit = g(d, 'situation', {});
  var tasks = g(d, 'tasks', {});
  var items = g(d, 'items', {});

  // Profile card
  h += '<div class="card">';
  h += '<div class="card-header"><span class="ch-icon">👤</span><span class="ch-title">个人档案</span></div>';
  var name = g(user, 'name', '未设置');
  var birth = g(user, 'birth_date', '');
  var curDate = g(time, 'current_date', '');
  var age = calcAge(birth, curDate);
  var gender = g(user, 'gender', '');
  var height = g(user, 'height', '');
  h += '<div class="stat-row"><span class="sl">姓名</span><span class="sr highlight">'+safeDisplay(name)+'</span></div>';
  var ageStr = age !== null ? age + ' 岁' : '-';
  h += '<div class="stat-row"><span class="sl">性别 / 年龄</span><span class="sr">'+(gender||'-')+' · '+ageStr+'</span></div>';
  if (height) h += '<div class="stat-row"><span class="sl">身高</span><span class="sr">'+height+' cm</span></div>';
  var bg = g(user, 'background', {});
  if (g(bg,'current_status')) h += '<div class="stat-row"><span class="sl">当前</span><span class="sr" style="font-size:11px">'+safeDisplay(g(bg,'current_status'))+'</span></div>';
  if (g(bg,'residence')) h += '<div class="stat-row"><span class="sl">住所</span><span class="sr" style="font-size:11px">'+safeDisplay(g(bg,'residence'))+'</span></div>';
  h += '</div>';

  // Situation
  var cur = g(sit, 'current');
  if (cur) {
    h += '<div class="card">';
    h += '<div class="stat-row"><span class="sl">📍 当前处境</span><span class="sr" style="font-size:11px;max-width:200px">'+safeDisplay(cur)+'</span></div>';
    h += '</div>';
  }

  // Items
  var itemKeys = typeof items === 'object' ? Object.keys(items) : [];
  if (itemKeys.length > 0) {
    h += '<div class="section-title">随身物品</div>';
    h += '<div class="mini-list">';
    itemKeys.forEach(function(k){
      var v = items[k];
      h += '<div class="mini-item"><span class="ml">'+safeDisplay(g(v,'name',k))+'</span><span class="mr">x'+safeDisplay(g(v,'quantity',1))+'</span></div>';
    });
    h += '</div>';
  }

  // Tasks
  var taskArr = typeof tasks === 'object' ? Object.keys(tasks).map(function(k){return tasks[k]}) : [];
  if (taskArr.length > 0) {
    h += '<div class="section-title">任务</div>';
    h += '<div class="card">';
    var active = taskArr.filter(function(t){return g(t,'status')==='进行中'});
    var done = taskArr.filter(function(t){return g(t,'status')==='已完成'});
    var fails = taskArr.filter(function(t){return g(t,'status')==='已失败'});
    h += '<div style="display:flex;gap:6px;margin-bottom:6px">';
    h += '<span class="tag blue">进行中 '+active.length+'</span>';
    if (done.length) h += '<span class="tag green">已完成 '+done.length+'</span>';
    if (fails.length) h += '<span class="tag red">已失败 '+fails.length+'</span>';
    h += '</div>';
    taskArr.slice(0,4).forEach(function(t){
      var cls = g(t,'status')==='已完成'?'green':g(t,'status')==='已失败'?'red':'';
      h += '<div class="stat-row"><span class="sl">'+safeDisplay(g(t,'name'))+'</span><span class="sr" style="color:var(--'+(cls||'text2')+')">'+safeDisplay(g(t,'status'))+'</span></div>';
    });
    h += '</div>';
  }

  document.getElementById('panel-state').innerHTML = h || '<div class="placeholder"><div class="ph-icon">📋</div><div class="ph-text">暂无数据</div></div>';
}

// ===== 地图 =====
function renderMap(d) {
  var h = '';
  var time = g(d, 'time', {});
  var sit = g(d, 'situation', {});
  var world = g(d, 'world', {});
  var rep = g(d, 'reputation', {});

  // Time card
  h += '<div class="card">';
  h += '<div class="card-header"><span class="ch-icon">🕐</span><span class="ch-title">时间线</span></div>';
  h += '<div class="stat-row"><span class="sl">日期</span><span class="sr highlight">'+safeDisplay(g(time,'current_date'))+'</span></div>';
  h += '<div class="stat-row"><span class="sl">穿越第</span><span class="sr">'+safeDisplay(g(time,'day_count'))+' 天</span></div>';
  h += '</div>';

  // Location
  var curLoc = g(sit, 'current');
  if (curLoc) {
    h += '<div class="card">';
    h += '<div class="card-header"><span class="ch-icon">📍</span><span class="ch-title">当前位置</span></div>';
    h += '<div style="font-size:12px;color:var(--text);line-height:1.6">'+safeDisplay(curLoc)+'</div>';
    h += '</div>';
  }

  // Locations
  var locLib = g(world, 'location_library', {});
  var regs = g(world, 'known_regions', {});
  var locKeys = Object.keys(locLib);
  var regKeys = Object.keys(regs);
  if (locKeys.length > 0 || regKeys.length > 0) {
    h += '<div class="section-title">已探索</div>';
    h += '<div class="mini-list">';
    locKeys.slice(0,3).forEach(function(k){
      var v = locLib[k];
      h += '<div class="mini-item"><span class="ml">📍 '+safeDisplay(g(v,'name',k))+'</span><span class="mr" style="font-size:10px">'+safeDisplay(g(v,'visited_date')).slice(0,10)+'</span></div>';
    });
    if (locKeys.length > 3) h += '<div class="placeholder" style="padding:4px;font-size:11px">...还有 '+(locKeys.length-3)+' 个地点</div>';
    h += '</div>';
  }

  // Reputation
  var repKeys = Object.keys(rep);
  if (repKeys.length > 0) {
    h += '<div class="section-title">声望</div>';
    h += '<div class="rep-row">';
    repKeys.forEach(function(k){
      var v = rep[k];
      var val = g(v, 'value', 0);
      var label = g(v, 'label', k);
      var dotColor = val >= 0 ? 'var(--green)' : 'var(--red)';
      h += '<span class="rep-chip" style="background:rgba(88,166,255,0.08);color:var(--text)"><span class="rc-dot" style="background:'+dotColor+'"></span>'+safeDisplay(label)+' <span style="color:'+(val>=0?'var(--green)':'var(--red)')+'">'+val+'</span></span>';
    });
    h += '</div>';
  }

  document.getElementById('panel-map').innerHTML = h || '<div class="placeholder"><div class="ph-icon">🗺️</div><div class="ph-text">暂无数据</div></div>';
}

// ===== 恋人 =====
function renderLover(d) {
  var rels = g(d, 'npc_relations', {});
  var sexual = g(d, 'sexual', {});
  var keys = Object.keys(rels);
  var h = '';

  var candidates = keys.filter(function(k){
    return g(rels[k], 'impression', -999) > 1;
  });

  if (candidates.length === 0) {
    h = '<div class="placeholder"><div class="ph-icon">💕</div><div class="ph-text">暂无亲密关系<br>多与 NPC 互动吧</div></div>';
  } else {
    candidates.sort(function(a,b){
      return g(rels[b], 'impression', 0) - g(rels[a], 'impression', 0);
    });
    candidates.forEach(function(k, idx){
      var v = rels[k];
      var name = g(v, 'name', '?');
      var imp = g(v, 'impression', 0);
      var rel = g(v, 'relationship', '');
      var known = g(v, 'known_since', '');
      var ctx = g(v, 'context', {});
      var sx = sexual[k];
      var inSexual = sx !== undefined;
      var statusStr = inSexual ? safeDisplay(g(sx, 'relationship_status', '')) : '';
      var ip = impProgress(imp);
      var avatars = ['🌸','🌟','🦋','🌙','💎','🎀','🍀','🌺'];
      var avatar = avatars[idx % avatars.length];

      var detail = '';
      detail += '<div><span class="lk">关系</span><span class="lv">'+safeDisplay(rel)+'</span></div>';
      detail += '<div><span class="lk">结识</span><span class="lv">'+safeDisplay(known)+'</span></div>';
      detail += '<div><span class="lk">情绪</span><span class="lv">'+safeDisplay(g(ctx,'current_mood'))+'</span></div>';
      detail += '<div><span class="lk">缘由</span><span class="lv">'+safeDisplay(g(ctx,'attitude_reason'))+'</span></div>';
      var taboos = g(ctx, 'taboos', []);
      if (taboos.length > 0) detail += '<div><span class="lk">禁忌</span><span class="lv">'+taboos.join('; ')+'</span></div>';

      if (inSexual) {
        detail += '<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)"></div>';
        detail += '<div><span class="lk">状态</span><span class="lv">'+safeDisplay(g(sx,'relationship_status'))+'</span></div>';
        detail += '<div><span class="lk">经验</span><span class="lv">'+(g(sx,'virgin',true)?'未経験':'body count '+safeDisplay(g(sx,'body_count',0)))+'</span></div>';
        var cycle = g(sx, 'cycle', {});
        if (g(cycle,'phase')) detail += '<div><span class="lk">周期</span><span class="lv">'+safeDisplay(g(cycle,'phase'))+'</span></div>';
        var preg = g(sx, 'pregnancy', {});
        if (g(preg, 'is_pregnant')) detail += '<div><span class="lk">孕期</span><span class="lv" style="color:var(--pink)">第 '+safeDisplay(g(preg,'weeks'))+' 周</span></div>';
      }

      h += '<div class="lover-card'+(idx===0?' open':'')+'">';
      h += '<div class="lover-head" onclick="var c=this.parentElement;c.classList.toggle(\'open\')">';
      h += '<div class="avatar" style="background:linear-gradient(135deg,'+(imp>=50?'var(--green-bg)':imp>=0?'var(--accent-glow)':'var(--red-bg)')+')">'+avatar+'</div>';
      h += '<div class="info"><div class="name">'+safeDisplay(name)+'</div>';
      h += '<div class="meta">';
      if (statusStr) h += '<span class="tag pink">'+statusStr+'</span>';
      h += '<span>'+safeDisplay(rel)+'</span>';
      h += '</div></div>';
      h += '<div class="imp">';
      h += '<div class="progress-wrap" style="width:70px"><div class="progress-bar"><div class="progress-fill '+ip.cls+'" style="width:'+ip.pct+'%"></div></div></div>';
      h += '<span class="val" style="color:'+impColor(imp)+'">'+imp+'</span>';
      h += '</div></div>';
      h += '<div class="lover-body">'+detail+'</div>';
      h += '</div>';
    });
  }

  document.getElementById('panel-lover').innerHTML = h;
}

// ===== 资产 =====
function renderAssets(d) {
  var ass = g(d, 'assets', {});
  var h = '';

  if (Object.keys(ass).length === 0) {
    h = '<div class="placeholder"><div class="ph-icon">💰</div><div class="ph-text">尚无资产数据</div></div>';
  } else {
    var cash = g(ass, 'cash');
    var bank = g(ass, 'bank');
    if (cash !== null || bank !== null) {
      h += '<div style="display:flex;gap:8px;margin-bottom:8px">';
      if (cash !== null) {
        h += '<div class="asset-card" style="flex:1"><div class="ac-label">💰 现金</div><div class="ac-value">¥'+Number(cash).toLocaleString()+'</div></div>';
      }
      if (bank !== null) {
        h += '<div class="asset-card" style="flex:1"><div class="ac-label">🏦 银行存款</div><div class="ac-value">¥'+Number(bank).toLocaleString()+'</div></div>';
      }
      h += '</div>';
    }

    var companies = g(ass, 'companies', {});
    if (Object.keys(companies).length > 0) {
      h += '<div class="section-title">公司 / 股份</div><div class="mini-list">';
      Object.keys(companies).forEach(function(k){
        var c = companies[k];
        h += '<div class="mini-item"><span class="ml">🏢 '+safeDisplay(g(c,'name',k))+'</span><span class="mr">'+safeDisplay(g(c,'shares',''))+'</span></div>';
      });
      h += '</div>';
    }

    var estates = g(ass, 'estates', {});
    if (Object.keys(estates).length > 0) {
      h += '<div class="section-title">房产</div><div class="mini-list">';
      Object.keys(estates).forEach(function(k){
        var e = estates[k];
        h += '<div class="mini-item"><span class="ml">🏠 '+safeDisplay(g(e,'name',k))+'</span><span class="mr" style="font-size:10px">'+safeDisplay(g(e,'address',''))+'</span></div>';
      });
      h += '</div>';
    }

    var vehicles = g(ass, 'vehicles', {});
    if (Object.keys(vehicles).length > 0) {
      h += '<div class="section-title">车辆</div><div class="mini-list">';
      Object.keys(vehicles).forEach(function(k){
        var v = vehicles[k];
        h += '<div class="mini-item"><span class="ml">🚗 '+safeDisplay(g(v,'name',k))+'</span><span class="mr">'+safeDisplay(g(v,'plate',''))+'</span></div>';
      });
      h += '</div>';
    }
  }

  document.getElementById('panel-assets').innerHTML = h;
}

// ===== 微信 =====
function renderWx(d) {
  var rels = g(d, 'npc_relations', {});
  var keys = Object.keys(rels);
  var h = '';

  if (keys.length === 0) {
    h = '<div class="placeholder"><div class="ph-icon">💬</div><div class="ph-text">暂无联系人</div></div>';
  } else {
    var sorted = keys.map(function(k){
      return {key:k, val:rels[k], since:g(rels[k], 'known_since', '2000-01-01')};
    });
    sorted.sort(function(a,b){ return b.since.localeCompare(a.since); });

    sorted.slice(0, 15).forEach(function(item){
      var v = item.val;
      var name = g(v, 'name', '?');
      var rel = g(v, 'relationship', '');
      var mood = g(v, 'context.current_mood', '');
      var imp = g(v, 'impression', 0);
      var known = g(v, 'known_since', '');
      var emoji = imp >= 50 ? '😊' : imp >= 1 ? '🙂' : imp >= -20 ? '😐' : '😶';
      var preview = mood ? safeDisplay(mood).slice(0, 30) : '暂无消息';
      var ip = impProgress(imp);

      h += '<div class="card" style="display:flex;gap:10px;align-items:center;padding:8px 10px;cursor:default">';
      h += '<div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,'+(imp>=50?'var(--green-bg)':imp>=0?'var(--accent-glow)':'var(--red-bg)')+');display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+emoji+'</div>';
      h += '<div style="flex:1;min-width:0">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center">';
      h += '<span style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+safeDisplay(name)+'</span>';
      h += '<span style="font-size:10px;color:var(--text3);flex-shrink:0">'+known+'</span>';
      h += '</div>';
      h += '<div style="display:flex;align-items:center;gap:6px;margin-top:2px">';
      h += '<span style="font-size:11px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+preview+'</span>';
      h += '</div>';
      h += '<div style="margin-top:3px"><div class="progress-wrap" style="width:100%"><div class="progress-bar"><div class="progress-fill '+ip.cls+'" style="width:'+ip.pct+'%"></div></div><span style="font-size:10px;color:'+impColor(imp)+';min-width:24px;text-align:right;margin-left:4px">'+imp+'</span></div></div>';
      h += '</div></div>';
    });
  }

  document.getElementById('panel-wx').innerHTML = h;
}

// ===== 言灵 =====
function renderGeass(d) {
  var geass = g(d, 'geass', {});
  var keys = Object.keys(geass);
  var h = '';

  if (keys.length === 0) {
    h = '<div class="placeholder"><div class="ph-icon">✨</div><div class="ph-text">尚未获得言灵能力</div></div>';
  } else {
    h += '<div class="geass-grid">';
    keys.forEach(function(k){
      var v = geass[k];
      var types = g(v,'type','能力');
      var typeIcon = types.indexOf('攻击')>=0?'⚔️':types.indexOf('防御')>=0?'🛡️':types.indexOf('辅助')>=0?'💊':'✨';
      h += '<div class="geass-item">';
      h += '<div class="gi-icon">'+typeIcon+'</div>';
      h += '<div class="gi-info"><div class="gi-name">'+safeDisplay(g(v,'name'))+'</div><div class="gi-meta">'+safeDisplay(g(v,'description')).slice(0,40)+'</div></div>';
      h += '<div class="gi-count">×'+safeDisplay(g(v,'total_uses',0))+'</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  document.getElementById('panel-geass').innerHTML = h;
}

// ===== Data from Mvu =====
var hasRendered = false;

function findMvu() {
  try { if (typeof Mvu !== 'undefined' && Mvu.getMvuData) return { ref: Mvu, src: 'window' }; } catch(e) {}
  var w = window;
  for (var i = 0; i < 5; i++) {
    try {
      if (w.parent && w.parent !== w) {
        w = w.parent;
        if (w.Mvu && w.Mvu.getMvuData) return { ref: w.Mvu, src: 'parentL' + (i + 1) };
      } else break;
    } catch(e) { break; }
  }
  return null;
}

function getStatData() {
  var info = findMvu();
  if (info) {
    try {
      var raw = info.ref.getMvuData({ type: 'chat' });
      if (!raw) return null;
      var sd = raw.stat_data;
      if (!sd) return null;
      if (sd.stat_data && typeof sd.stat_data === 'object' && sd.stat_data.user) {
        return { data: sd.stat_data, mvuSrc: info.src, nesting: 'double' };
      }
      return { data: sd, mvuSrc: info.src, nesting: 'single' };
    } catch(e) {
      return { error: e.message, mvuSrc: info.src };
    }
  }
  return null;
}

function initStatusbar() {
  var dbg = document.getElementById('panel-state');
  if (!dbg) return;

  function tryRender() {
    var result = getStatData();
    if (result) {
      if (result.data) {
        render(result.data);
        hasRendered = true;
        return true;
      }
      if (result.error && !hasRendered) {
        dbg.innerHTML = '<div class="placeholder"><div class="ph-icon">⚠️</div><div class="ph-text">读取错误: '+result.error+'<br>来源: '+(result.mvuSrc||'?')+'</div></div>';
      }
    }
    if (!hasRendered) {
      dbg.innerHTML = '<div class="placeholder"><div class="ph-icon">⏳</div><div class="ph-text">等待 MVU 数据...</div></div>';
    }
    return false;
  }

  if (tryRender()) return;

  var info = findMvu();
  if (info) {
    try {
      info.ref.on('mag_variable_initiailized', function() {
        setTimeout(tryRender, 500);
        setTimeout(tryRender, 3000);
      });
      info.ref.on('mag_variable_update_ended', function() {
        setTimeout(tryRender, 500);
      });
    } catch(e) {}
  }

  if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'rw-sb-request' }, '*');
    window.addEventListener('message', function(e) {
      if (!e.data) return;
      if (e.data.type === 'sb-data' && e.data.stat_data) {
        render(e.data.stat_data);
        hasRendered = true;
      }
    });
  }

  var attempt = 0;
  var poll = setInterval(function() {
    if (hasRendered) { clearInterval(poll); return; }
    attempt++;
    if (attempt > 30) { clearInterval(poll); return; }
    tryRender();
  }, 2000);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function() { setTimeout(initStatusbar, 500); });
} else {
  setTimeout(initStatusbar, 500);
}

// --- tabs ---
document.getElementById('tabs').addEventListener('click', function(e){
  var tab = e.target.closest('.tab');
  if (!tab) return;
  var name = tab.getAttribute('data-tab');
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  tab.classList.add('active');
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  var panel = document.getElementById('panel-'+name);
  if (panel) panel.classList.add('active');
});

})();
</script>
